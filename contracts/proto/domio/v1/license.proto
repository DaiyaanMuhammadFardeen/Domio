// Domio license.proto
//
// License grant issuance and verification. Grants are JWTs signed by the
// license service; verification supports online (POST /v1/license/verify)
// and offline (30-day grace window in the client).

syntax = "proto3";

package domio.v1;

import "domio/v1/common.proto";

option go_package = "github.com/domio/platform/gen/go/domio/v1;domiov1";

message VerifyLicenseRequest {
  string token = 1;
  string catalog_id = 2;
  string version = 3;
}

message VerifyLicenseResponse {
  bool valid = 1;
  string reason = 2; // ok | expired | revoked | tampered | seat_limit
  LicenseGrant grant = 3;
  int64 offline_grace_seconds_left = 4;
}

message ListGrantsRequest {
  ResourceId workspace = 1;
}

message ListGrantsResponse {
  repeated LicenseGrant grants = 1;
}

service LicenseService {
  rpc Verify(VerifyLicenseRequest) returns (VerifyLicenseResponse);
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);
}
