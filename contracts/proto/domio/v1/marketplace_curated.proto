// Domio marketplace_curated.proto
//
// Brand-locked marketplace curation. Admin-curated mapping of marketplace
// listings to a brand-kit scope. Phase 19 — message-only (no RPCs in Wave 1;
// the marketplace-service REST handlers own the surface).

syntax = "proto3";

package domio.v1;

option go_package = "github.com/domio/platform/gen/go/domio/v1;domiov1";

// -----------------------------------------------------------------------------
// Enums
// -----------------------------------------------------------------------------

// BrandLockState controls marketplace listing visibility for a brand-scope.
enum BrandLockState {
  BRAND_LOCK_STATE_UNSPECIFIED = 0;
  BRAND_LOCK_STATE_ALLOW = 1;
  BRAND_LOCK_STATE_DENY = 2;
  BRAND_LOCK_STATE_OVERRIDE = 3;
}

// -----------------------------------------------------------------------------
// Messages
// -----------------------------------------------------------------------------

// BrandLockedListing represents an admin-curated mapping of a marketplace
// listing to a brand-kit scope. The state controls visibility for the
// brand-scope: allow shows the listing, deny hides it, override enables
// per-brand pricing.
message BrandLockedListing {
  string id = 1;
  string workspace_id = 2;
  string brand_kit_id = 3;
  string marketplace_listing_id = 4;
  BrandLockState state = 5;
  int64 override_price_cents = 6; // optional per-brand price override (0 = use listing price)
  string notes = 7;
  string audit_actor_id = 8;
  int64 created_at_ms = 9;
  int64 updated_at_ms = 10;
}
