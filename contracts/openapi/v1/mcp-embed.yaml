                deckId: { type: string }
                name: { type: string }
                provider: { type: string, enum: [mapbox, google, maplibre, custom] }
                styleUrl: { type: string }
                apiKeyId: { type: string }
                defaultZoom: { type: number }
                defaultLng: { type: number }
                defaultLat: { type: number }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
        '400':
