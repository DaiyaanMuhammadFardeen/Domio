openapi: 3.1.0
info:
  title: Domio Prototype Overlays API
  version: 1.0.0
  description: Overlay CRUD for Phase 10 M1.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: overlays
paths:
  /v1/decks/{deck_id}/overlays:
    get:
      tags: [overlays]
      operationId: listOverlays
      summary: List overlays for a deck
      parameters:
        - $ref: "#/components/parameters/DeckId"
        - $ref: "#/components/parameters/TenantId"
        - in: query
          name: slide_id
          schema: { type: string }
      responses:
        "200":
          description: Overlays in deterministic creation order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Overlay" }
    post:
      tags: [overlays]
      operationId: createOverlay
      summary: Create an overlay
      parameters:
        - $ref: "#/components/parameters/DeckId"
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOverlayRequest" }
      responses:
        "201":
          description: Overlay created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overlay" }
        "422": { description: Overlay validation failed. }
  /v1/overlays/{id}:
    get:
      tags: [overlays]
      operationId: getOverlay
      summary: Get an overlay
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Overlay details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overlay" }
        "404": { description: Overlay not found. }
    patch:
      tags: [overlays]
      operationId: patchOverlay
      summary: Update an overlay
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchOverlayRequest" }
      responses:
        "200":
          description: Overlay updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overlay" }
        "404": { description: Overlay not found. }
        "409": { description: Version conflict. }
    delete:
      tags: [overlays]
      operationId: deleteOverlay
      summary: Delete an overlay
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "204": { description: Overlay deleted. }
        "404": { description: Overlay not found. }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    TenantId:
      in: query
      name: tenant_id
      required: true
      schema: { type: string }
    DeckId:
      in: path
      name: deck_id
      required: true
      schema: { type: string }
    Id:
      in: path
      name: id
      required: true
      schema: { type: string }
  schemas:
    Overlay:
      type: object
      additionalProperties: false
      required: [id, tenantId, deckId, slideId, name, type, sizeStrategy, anchor, openTrigger, closeTrigger, persistent, schema, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        deckId: { type: string }
        slideId: { type: string }
        name: { type: string }
        type: { enum: [modal, tooltip, drawer, popover, sheet] }
        sizeStrategy: { enum: [small, medium, large, fullscreen, auto] }
        anchor: { type: [object, "null"] }
        openTrigger: { type: [object, "null"] }
        closeTrigger: { type: [object, "null"] }
        persistent: { type: boolean }
        schema: { type: object }
        version: { type: integer }
        createdAt: { type: integer }
        updatedAt: { type: integer }
    CreateOverlayRequest:
      type: object
      additionalProperties: false
      required: [slideId, name, type, sizeStrategy, schema]
      properties:
        slideId: { type: string }
        name: { type: string, minLength: 1 }
        type: { enum: [modal, tooltip, drawer, popover, sheet] }
        sizeStrategy: { enum: [small, medium, large, fullscreen, auto] }
        anchor: { type: [object, "null"] }
        openTrigger: { type: [object, "null"] }
        closeTrigger: { type: [object, "null"] }
        persistent: { type: boolean, default: false }
        schema: { type: object }
    PatchOverlayRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer }
        name: { type: string }
        type: { enum: [modal, tooltip, drawer, popover, sheet] }
        sizeStrategy: { enum: [small, medium, large, fullscreen, auto] }
        anchor: { type: [object, "null"] }
        openTrigger: { type: [object, "null"] }
        closeTrigger: { type: [object, "null"] }
        persistent: { type: boolean }
        schema: { type: object }