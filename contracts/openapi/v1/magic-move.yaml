openapi: 3.1.0
info:
  title: Domio Magic Move API
  version: 1.0.0
  description: |
    Magic Move compute service — submits morph jobs that match elements
    between two slides and computes interpolated element paths for
    slide-to-slide transitions. Phase 09.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: jobs
    description: Magic Move compute jobs.
paths:
  /v1/magic-move/jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: List magic-move jobs
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, computing, done, failed]
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
    post:
      tags: [jobs]
      operationId: createJob
      summary: Submit a magic-move compute job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicMoveJob'
        '400':
          description: Validation error.
  /v1/magic-move/jobs/{id}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get a magic-move job by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicMoveJob'
        '404':
          description: Job not found.
    delete:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel a pending or computing job
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Job cancelled.
        '404':
          description: Job not found.
        '409':
          description: Job already completed or failed.
components:
  schemas:
    MagicMoveJob:
      type: object
      required:
        - id
        - tenantId
        - deckId
        - fromSlideId
        - toSlideId
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        tenantId:
          type: string
        deckId:
          type: string
        fromSlideId:
          type: string
        toSlideId:
          type: string
        status:
          type: string
          enum: [pending, computing, done, failed]
        result:
          $ref: '#/components/schemas/MagicMoveResult'
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MagicMoveResult:
      type: object
      properties:
        elementMappings:
          type: array
          items:
            $ref: '#/components/schemas/ElementMapping'
        matchedCount:
          type: integer
        unmatchedFromCount:
          type: integer
        unmatchedToCount:
          type: integer
    ElementMapping:
      type: object
      required: [fromElementId, toElementId, matchType]
      properties:
        fromElementId:
          type: string
        toElementId:
          type: string
        matchType:
          type: string
          enum: [exact, morph, new, removed]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        path:
          type: array
          description: Interpolated position/size path for the morph
          items:
            type: object
            properties:
              timeMs:
                type: number
              x:
                type: number
              y:
                type: number
              width:
                type: number
              height:
                type: number
              opacity:
                type: number
    CreateJobRequest:
      type: object
      required: [tenantId, deckId, fromSlideId, toSlideId]
      properties:
        tenantId:
          type: string
        deckId:
          type: string
        fromSlideId:
          type: string
        toSlideId:
          type: string
    JobListResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/MagicMoveJob'
