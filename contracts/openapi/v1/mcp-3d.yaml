          application/json:
            schema:
              type: object
              required: [deckId, keyframeId]
              properties:
                deckId: { type: string }
                keyframeId: { type: string }
      responses:
        '200':
          description: OK
        '400':
          description: invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpError' }
  /tools/list_camera_keyframes:
    post:
      operationId: mcp_list_camera_keyframes
      tags: [camera-keyframes]
      summary: list_camera_keyframes
      description: List camera keyframes for a slide. Requires `manage_scenes`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deckId, slideId]
              properties:
                deckId: { type: string }
                slideId: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
        '400':
          description: invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpError' }
  /tools/create_shader:
    post:
      operationId: mcp_create_shader
      tags: [shaders]
      summary: create_shader
      description: Create a shader. Requires `manage_assets`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deckId, name, kind, sourceWgsl, sourceGlsl]
              properties:
                deckId: { type: string }
                name: { type: string }
                kind: { type: string, enum: [background, particle, material, post] }
                sourceWgsl: { type: string }
                sourceGlsl: { type: string }
                inputs: { type: object }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
        '400':
          description: invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpError' }
  /tools/update_shader:
    post:
      operationId: mcp_update_shader
      tags: [shaders]
      summary: update_shader
      description: Update a shader. Requires `manage_assets`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deckId, shaderId]
              properties:
                deckId: { type: string }
                shaderId: { type: string }
                patch: { type: object }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
        '400':
