              schema: { $ref: '#/components/schemas/McpError' }
  /tools/delete_shader:
    post:
      operationId: mcp_delete_shader
      tags: [shaders]
      summary: delete_shader
      description: Delete a shader. Requires `manage_assets`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deckId, shaderId]
              properties:
                deckId: { type: string }
                shaderId: { type: string }
      responses:
        '200':
          description: OK
        '400':
          description: invalid input
          content:
