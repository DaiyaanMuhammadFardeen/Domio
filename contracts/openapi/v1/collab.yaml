        - bearerAuth: []
        - cookieAuth: []
    get:
      tags: [calendar]
      operationId: listCalendarLinks
      summary: List calendar links for the workspace.
      responses:
        '200':
          description: List of calendar links.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CalendarLink' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/calendar/links/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    delete:
      tags: [calendar]
      operationId: deleteCalendarLink
      summary: Remove a calendar link.
      responses:
        '204':
          description: Calendar link deleted.
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Calendar link not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/calendar/links/{id}/sync:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    post:
      tags: [calendar]
      operationId: syncCalendarLink
      summary: Manually trigger a sync with the calendar vendor.
      responses:
        '200':
          description: Sync completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarLink' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Calendar link not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/calendar/today:
    parameters:
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    get:
      tags: [calendar]
      operationId: getPresenterTodayView
      summary: Get today's presenter view — upcoming calendar-linked decks for the current user.
      responses:
        '200':
          description: Today's calendar-linked decks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CalendarLink' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  # ──────────────────────────────────────────────────────────────────────────
  # Guests
  # ──────────────────────────────────────────────────────────────────────────
  /v1/guests:
    parameters:
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    post:
      tags: [guests]
      operationId: createGuest
      summary: Create a scoped guest invitation and mint its first magic link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestInput' }
      responses:
        '201':
          description: Guest access created with a magic link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guest' }
        '400':
          description: Validation error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Feature disabled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/guests/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    get:
      tags: [guests]
      operationId: getGuest
      summary: Get a guest access record by ID.
      responses:
        '200':
          description: Guest access details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guest' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Guest not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []
    delete:
      tags: [guests]
      operationId: deleteGuest
      summary: Revoke a guest's access (soft revoke; invalidates open magic links).
      responses:
        '204':
          description: Guest access revoked.
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Guest not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/guests/{id}/magic-link:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    post:
      tags: [guests]
      operationId: resendGuestMagicLink
      summary: Resend a magic link (invalidates prior open links for this guest).
      responses:
        '200':
          description: New magic link issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Magic link token to send to the guest.
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Guest not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/guest-access/consume:
    post:
      tags: [guests]
      operationId: consumeGuestMagicLink
      summary: Exchange a magic link token for guest access (unauthenticated; the token is the credential).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MagicLinkConsumeInput' }
      responses:
        '200':
          description: Magic link consumed; guest access resolved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MagicLinkConsumeResult' }
        '401':
          description: Invalid, expired, consumed, or revoked magic link.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security: []

  # ──────────────────────────────────────────────────────────────────────────
  # Task Manager Links
  # ──────────────────────────────────────────────────────────────────────────
  /v1/task-links:
    parameters:
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    post:
      tags: [task-managers]
      operationId: createTaskLink
      summary: Create a bidirectional sync link between an assignment and an external task.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskLinkInput' }
      responses:
        '201':
          description: Task link created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskLink' }
        '400':
          description: Validation error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []
    get:
      tags: [task-managers]
      operationId: listTaskLinks
      summary: List task links for the workspace.
      responses:
        '200':
          description: List of task links.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskLink' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/task-links/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    patch:
      tags: [task-managers]
      operationId: updateTaskLink
      summary: Update a task link's field mapping or sync mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                field_map:
                  type: object
                  description: Updated declarative field mapping.
                sync_mode:
                  type: string
                  enum: [domio_wins, task_wins, last_write_wins]
      responses:
        '200':
          description: Task link updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskLink' }
        '400':
          description: Validation error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Task link not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []
    delete:
      tags: [task-managers]
      operationId: deleteTaskLink
      summary: Delete a task link.
      responses:
        '204':
          description: Task link deleted.
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Task link not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/task-links/{id}/sync:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    post:
      tags: [task-managers]
      operationId: syncTaskLink
      summary: Manually trigger a sync with the external task tracker.
      responses:
        '200':
          description: Sync completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskLink' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Task link not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

# ════════════════════════════════════════════════════════════════════════════
# Components
# ════════════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: domio_session
  schemas:
    ProblemDetail:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the problem type.
          example: 'https://domio.example/problems/not-found'
        title:
          type: string
          description: Short human-readable summary.
          example: 'Resource not found'
        status:
          type: integer
          description: HTTP status code.
          example: 404
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: "Deck with id 'abc-123' does not exist in workspace 'w-1'."
        instance:
          type: string
          format: uri
          description: URI reference identifying the specific occurrence.
          example: 'https://api.domio.example.com/v1/decks/abc-123/comments'
    CommentInput:
      type: object
      required: [body_md, target_type, target_id]
      properties:
        body_md:
          type: string
          description: Markdown body of the comment.
        target_type:
          type: string
          enum: [element, slide, deck]
        target_id:
          type: string
        parent_id:
          type: string
          nullable: true
          description: Parent comment ID for replies.
        anchor:
          type: object
          description: Optional anchor with element/slide coordinates.
          properties:
            element:
              type: object
              properties:
                x: { type: number }
                y: { type: number }
            slide:
              type: object
              properties:
                x: { type: number }
                y: { type: number }
        attachments:
          type: array
          items: { type: object }
          description: Optional array of attachment objects.
    Comment:
      type: object
      required:
        [
          id,
          workspace_id,
          deck_id,
          thread_id,
          author_id,
          author_type,
          body_md,
          target_type,
          target_id,
          status,
          created_at,
        ]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        deck_id: { type: string }
        thread_id: { type: string }
        parent_id: { type: string, nullable: true }
        author_id: { type: string }
        author_type:
          type: string
          enum: [member, guest, agent]
        body_md: { type: string }
        target_type:
          type: string
          enum: [element, slide, deck]
        target_id: { type: string }
        anchor:
          type: object
          nullable: true
          properties:
            element:
              type: object
              properties:
                x: { type: number }
                y: { type: number }
            slide:
              type: object
              properties:
                x: { type: number }
                y: { type: number }
        status:
          type: string
          enum: [open, resolved]
        is_orphaned: { type: boolean }
        emoji_reactions: { type: object, description: 'JSONB map of emoji → user_id[]' }
        attachments: { type: array, items: { type: object } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolved_by: { type: string, nullable: true }
    ApprovalRequestInput:
      type: object
      required: [deck_id, version_id, policy]
      properties:
        deck_id: { type: string }
        version_id:
          { type: string, description: Immutable snapshot/version of the deck under review. }
        policy:
          type: object
          required: [lanes]
          description: Approval policy with lane definitions.
          properties:
            lanes:
              type: array
              items:
                type: object
                required: [lane, role, required]
                properties:
                  lane:
                    type: string
                    description: 'Lane identifier (e.g. design, content, executive).'
                  role:
                    type: string
                    description: Required workspace role for approvers in this lane.
                  required:
                    type: boolean
                    description: Whether this lane must approve for overall approval.
                  sla_hours:
                    type: number
                    description: SLA in hours for this lane to respond.
        submit_now:
          type: boolean
          description: If true, submit immediately (draft → pending).
    ApprovalRequest:
      type: object
      required:
        [
          id,
          workspace_id,
          deck_id,
          version_id,
          requested_by,
          requested_at,
          policy,
          status,
          created_at,
        ]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        deck_id: { type: string }
        version_id: { type: string }
        requested_by: { type: string }
        requested_at: { type: string, format: date-time }
        policy:
          type: object
          required: [lanes]
          properties:
            lanes:
              type: array
              items:
                type: object
                properties:
                  lane: { type: string }
                  role: { type: string }
                  required: { type: boolean }
                  sla_hours: { type: number }
        status:
          type: string
          enum: [draft, pending, approved, rejected, changes_requested]
        closed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ApprovalDecisionInput:
      type: object
      required: [lane, decision]
      properties:
        lane: { type: string }
        decision:
          type: string
          enum: [approved, rejected, changes_requested]
        justification: { type: string, nullable: true }
    ApprovalDecision:
      type: object
      required: [id, workspace_id, request_id, lane, approver_id, decision, decided_at, version_id]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        request_id: { type: string }
        lane: { type: string }
        approver_id: { type: string }
        decision:
          type: string
          enum: [approved, rejected, changes_requested]
        justification: { type: string, nullable: true }
        decided_at: { type: string, format: date-time }
        version_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssignmentInput:
      type: object
      required: [deck_id, slide_range, primary_id]
      properties:
        deck_id: { type: string }
        slide_range:
          type: array
          items: { type: integer }
          minItems: 2
          maxItems: 2
          description: Inclusive slide index range [lo, hi].
        primary_id: { type: string, description: UUID of the user primarily responsible. }
        watchers:
          type: array
          items: { type: string }
          description: UUIDs of users to watch this assignment.
        due_at: { type: string, format: date-time, nullable: true }
    Assignment:
      type: object
      required: [id, workspace_id, deck_id, slide_range, primary_id, watchers, status, created_at]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        deck_id: { type: string }
        slide_range:
          type: array
          items: { type: integer }
          minItems: 2
          maxItems: 2
          description: Inclusive slide index range [lo, hi].
        primary_id: { type: string }
        watchers:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [not_started, in_progress, blocked, review, done]
        blocked_reason: { type: string, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        task_link_id:
          { type: string, nullable: true, description: Optional FK to external task tracker. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GrantInput:
      type: object
      required: [resource_type, resource_id, principal_id, principal_type, capabilities]
      properties:
        resource_type: { type: string, enum: [workspace, folder, project, deck, slide] }
        resource_id: { type: string }
        principal_id: { type: string }
        principal_type: { type: string, enum: [user, group] }
        capabilities:
          { type: array, items: { type: string }, description: Array of granular capabilities. }
        is_deny:
          {
            type: boolean,
            default: false,
            description: When true,
            this is a deny grant (deny-first evaluation).,
          }
        effective_from:
          { type: string, format: date-time, description: Start of the grant's temporal window. }
        effective_to:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: End of the grant's temporal window; null = indefinite.,
          }
    PermissionGrant:
      type: object
      required:
        [
          id,
          workspace_id,
          resource_type,
          resource_id,
          principal_id,
          principal_type,
          capabilities,
          is_deny,
          effective_from,
          created_at,
        ]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        resource_type: { type: string, enum: [workspace, folder, project, deck, slide] }
        resource_id: { type: string }
        principal_id: { type: string }
        principal_type: { type: string, enum: [user, group] }
        capabilities: { type: array, items: { type: string } }
        is_deny: { type: boolean }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PermissionCheckInput:
      type: object
      required: [workspace_id, actor_id, resource_type, resource_id, capability]
      properties:
        workspace_id: { type: string }
        actor_id: { type: string }
        resource_type: { type: string, enum: [workspace, folder, project, deck, slide] }
        resource_id: { type: string }
        capability: { type: string }
        at:
          type: string
          format: date-time
          nullable: true
          description: Point-in-time evaluation; null means 'now'.
    PermissionEvaluation:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean }
        reason:
          {
            type: string,
            nullable: true,
            description: Human-readable reason for the evaluation result.,
          }

    # ──────────────────────────────────────────────────────────────────────
    # Library
    # ──────────────────────────────────────────────────────────────────────
    LibraryEntryInput:
      type: object
      required: [workspace_id, scope, title, owner_id, initial_snapshot]
      properties:
        workspace_id: { type: string }
        scope:
          type: string
          enum: [workspace, org, team]
        team_id: { type: string, nullable: true, description: Required when scope=team. }
        title: { type: string }
        description: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
          default: []
        owner_id: { type: string, description: UUID of the owner responsible for this entry. }
        approval_chain:
          type: object
          description: Optional JSONB approval lane/role configuration.
          default: {}
        initial_snapshot:
          type: object
          required: [slide_snapshot]
          description: The first version snapshot for this entry.
          properties:
            slide_snapshot:
              type: object
              description: Full slide structure JSONB.
            data_bindings:
              type: array
              items: { type: object }
              default: []
            brand_locked:
              type: boolean
              default: false
    LibraryEntry:
      type: object
      required:
        [id, workspace_id, scope, title, owner_id, status, version_id, created_at, updated_at]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        scope:
          type: string
          enum: [workspace, org, team]
        team_id: { type: string, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        owner_id: { type: string }
        approval_chain: { type: object, description: JSONB approval lane/role configuration. }
        status:
          type: string
          enum: [draft, pending, approved, retired]
        version_id: { type: string, description: UUID of the current version. }
        superseded_by: { type: string, nullable: true }
        last_reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LibraryVersionInput:
      type: object
      required: [slide_snapshot]
      properties:
        slide_snapshot:
          type: object
          description: Full slide structure JSONB.
        data_bindings:
          type: array
          items: { type: object }
          default: []
        brand_locked:
          type: boolean
          default: false
    LibraryVersion:
      type: object
      required:
        [
          id,
          entry_id,
          version_num,
          slide_snapshot,
          data_bindings,
          brand_locked,
          created_by,
          created_at,
        ]
      properties:
        id: { type: string }
        entry_id: { type: string }
        version_num: { type: integer }
        slide_snapshot: { type: object, description: Full slide structure JSONB. }
        data_bindings: { type: array, items: { type: object } }
        brand_locked: { type: boolean }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    # ──────────────────────────────────────────────────────────────────────
    # Auto-Update
    # ──────────────────────────────────────────────────────────────────────
    AutoUpdateBindingInput:
      type: object
      required: [consumer_deck_id, consumer_slide_id, library_entry_id, mode]
      properties:
        consumer_deck_id: { type: string }
        consumer_slide_id: { type: string }
        library_entry_id: { type: string }
        pinned_version_id:
          { type: string, nullable: true, description: Pin to a specific version; null = latest. }
        mode:
          type: string
          enum: [immediate, scheduled, manual, frozen]
          default: manual
        schedule:
          type: object
          description: Schedule configuration (cron/interval) when mode=scheduled.
          default: {}
        is_mandatory:
          type: boolean
          default: false
          description: If true, consumer cannot override the binding.
    AutoUpdateBinding:
      type: object
      required:
        [
          id,
          consumer_deck_id,
          consumer_slide_id,
          library_entry_id,
          mode,
          is_mandatory,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string }
        consumer_deck_id: { type: string }
        consumer_slide_id: { type: string }
        library_entry_id: { type: string }
        pinned_version_id: { type: string, nullable: true }
        mode:
          type: string
          enum: [immediate, scheduled, manual, frozen]
        schedule: { type: object }
        is_mandatory: { type: boolean }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_sync_status: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ──────────────────────────────────────────────────────────────────────
    # Expiry
    # ──────────────────────────────────────────────────────────────────────
    ExpiryPolicyInput:
      type: object
      required: [resource_type, resource_id, interval_days]
      properties:
        resource_type:
          {
            type: string,
            description: Polymorphic resource type (e.g. deck,
            slide,
            library_entry).,
          }
        resource_id: { type: string, description: UUID of the resource being governed. }
        interval_days: { type: integer, description: Review interval in days (must be > 0). }
        responsible_id:
          { type: string, nullable: true, description: UUID of the responsible reviewer. }
        escalation:
          type: string
          enum: [gentle, moderate, strict]
          default: gentle
        auto_revoke_share:
          type: boolean
          default: false
          description: If true, revoke share links when policy expires.
    ExpiryPolicy:
      type: object
      required:
        [id, resource_type, resource_id, interval_days, escalation, auto_revoke_share, created_at]
      properties:
        id: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        interval_days: { type: integer }
        responsible_id: { type: string, nullable: true }
        escalation:
          type: string
          enum: [gentle, moderate, strict]
        auto_revoke_share: { type: boolean }
        created_at: { type: string, format: date-time }
    FreshnessFlag:
      type: object
      required: [id, resource_type, resource_id, flagged_at, reason]
      properties:
        id: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        flagged_at: { type: string, format: date-time }
        reason:
          type: string
          enum: [policy_overdue, manual, ai_detected]
        resolved_at: { type: string, format: date-time, nullable: true }
        resolved_by: { type: string, nullable: true }

    # ──────────────────────────────────────────────────────────────────────
    # Suggestions
    # ──────────────────────────────────────────────────────────────────────
    SuggestionInput:
      type: object
      required: [target_type, target_id, operation]
      properties:
        target_type:
          type: string
          enum: [element, slide, data_binding]
          description: Type of the target being modified.
        target_id:
          type: string
          description: UUID of the target element, slide, or data binding.
        operation:
          type: object
          description: Structured CRDT operation {type, params, before_state, after_state}.
        thread_id:
          type: string
          nullable: true
          description: Optional thread ID for discussion.
    Suggestion:
      type: object
      required:
        [
          suggestion_id,
          deck_id,
          session_id,
          author_id,
          target_type,
          target_id,
          operation,
          status,
          created_at,
        ]
      properties:
        suggestion_id: { type: string }
        deck_id: { type: string }
        session_id: { type: string }
        author_id: { type: string }
        target_type:
          type: string
          enum: [element, slide, data_binding]
        target_id: { type: string }
        operation:
          type: object
          description: Structured CRDT operation {type, params, before_state, after_state}.
        status:
          type: string
          enum: [open, accepted, rejected, obsolete]
        thread_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolved_by: { type: string, nullable: true }

    # ──────────────────────────────────────────────────────────────────────
    # Merge Requests
    # ──────────────────────────────────────────────────────────────────────
    MergeRequestInput:
      type: object
      required: [source_branch, target_branch, title]
      properties:
        source_branch:
          type: string
          description: Source branch name.
        target_branch:
          type: string
          description: Target branch name.
        title:
          type: string
          description: Title of the merge request.
        description:
          type: string
          nullable: true
          description: Optional description of the merge request.
    MergeRequest:
      type: object
      required: [mr_id, deck_id, source_branch, target_branch, title, author_id, status, created_at]
      properties:
        mr_id: { type: string }
        deck_id: { type: string }
        source_branch: { type: string }
        target_branch: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        author_id: { type: string }
        status:
          type: string
          enum: [open, approved, merged, closed, conflict]
        diff_id: { type: string, nullable: true, description: UUID of the computed slide diff. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        merged_at: { type: string, format: date-time, nullable: true }
        merged_by: { type: string, nullable: true }
        merge_commit_id: { type: string, nullable: true }
    SlideDiff:
      type: object
      required:
        [
          mr_id,
          base_version_id,
          target_version_id,
          source_version_id,
          slide_diffs,
          binding_diffs,
          computed_at,
        ]
      properties:
        mr_id: { type: string }
        base_version_id: { type: string }
        target_version_id: { type: string }
        source_version_id: { type: string }
        slide_diffs:
          type: array
          items: { type: object }
          description: Per-slide diff objects.
        binding_diffs:
          type: array
          items: { type: object }
          description: Per-binding diff objects.
        computed_at: { type: string, format: date-time }
    SlideDiffLevel:
      type: string
      enum: [slide, element, data_binding]
      description: Diff granularity level.

    # ──────────────────────────────────────────────────────────────────────
    # Meeting Integrations
    # ──────────────────────────────────────────────────────────────────────
    MeetingIntegrationInput:
      type: object
      required: [vendor]
      properties:
        vendor:
          type: string
          enum: [zoom, meet, teams]
          description: Meeting vendor to connect.
    MeetingIntegration:
      type: object
      required:
        [id, workspace_id, vendor, status, connected_by, connected_at, created_at, updated_at]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        vendor:
          type: string
          enum: [zoom, meet, teams]
        status:
          type: string
          enum: [disconnected, connecting, connected, error]
        connected_by: { type: string }
        connected_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MeetingTokenRequest:
      type: object
      required: [meeting_id, presenter_id, deck_id]
      properties:
        meeting_id:
          type: string
          description: Vendor-specific meeting ID.
        presenter_id:
          type: string
          description: UUID of the presenter requesting the token.
        deck_id:
          type: string
          description: UUID of the deck being presented.
    MeetingToken:
      type: object
      required: [token, meeting_id, presenter_id, deck_id, expires_at]
      properties:
        token:
          type: string
          description: Scoped meeting token (JWT, expires 1h after meeting end).
        meeting_id:
          type: string
        presenter_id:
          type: string
        deck_id:
          type: string
        expires_at:
          type: string
          format: date-time
          description: Token expiration time (1h after meeting end).
    MeetingMarkerInput:
      type: object
      required: [meeting_id, slide_id, transitioned_at]
      properties:
        meeting_id:
          type: string
          description: Vendor-specific meeting ID.
        slide_id:
          type: string
          description: UUID of the slide the presenter transitioned to.
        transitioned_at:
          type: string
          format: date-time
          description: Timestamp of the slide transition.

    # ──────────────────────────────────────────────────────────────────────
    # Calendar
    # ──────────────────────────────────────────────────────────────────────
    CalendarLinkInput:
      type: object
      required: [deck_id, vendor, event_id, event_start_at]
      properties:
        deck_id:
          type: string
          description: UUID of the deck to link.
        vendor:
          type: string
          enum: [google, outlook, icloud]
          description: Calendar vendor.
        event_id:
          type: string
          description: Vendor-specific calendar event identifier.
        event_start_at:
          type: string
          format: date-time
          description: Start time of the calendar event.
        is_recurring:
          type: boolean
          default: false
          description: Whether this is a recurring event.
        recurrence_id:
          type: string
          nullable: true
          description: Recurrence identifier for recurring events.
    CalendarLink:
      type: object
      required:
        [
          id,
          workspace_id,
          deck_id,
          user_id,
          vendor,
          event_id,
          event_start_at,
          is_recurring,
          last_synced_at,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        deck_id: { type: string }
        user_id: { type: string }
        vendor:
          type: string
          enum: [google, outlook, icloud]
        event_id: { type: string }
        event_start_at: { type: string, format: date-time }
        is_recurring: { type: boolean }
        recurrence_id: { type: string, nullable: true }
        last_synced_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ──────────────────────────────────────────────────────────────────────
    # Task Manager Links
    # ──────────────────────────────────────────────────────────────────────
    TaskLinkInput:
      type: object
      required: [assignment_id, vendor, external_task_id, external_project_id]
      properties:
        assignment_id:
          type: string
          description: UUID of the Domio assignment to link.
        vendor:
          type: string
          enum: [asana, jira, linear]
          description: External task tracker vendor.
        external_task_id:
          type: string
          description: Vendor-specific task identifier.
        external_project_id:
          type: string
          description: Vendor-specific project identifier.
        field_map:
          type: object
          default: {}
          description: Declarative field mapping {status, priority, ...}.
        sync_mode:
          type: string
          enum: [domio_wins, task_wins, last_write_wins]
          default: last_write_wins
          description: Conflict resolution strategy for bidirectional sync.
    TaskLink:
      type: object
      required:
        [
          id,
          workspace_id,
          assignment_id,
          vendor,
          external_task_id,
          external_project_id,
          field_map,
          sync_mode,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        assignment_id: { type: string }
        vendor:
          type: string
          enum: [asana, jira, linear]
        external_task_id: { type: string }
        external_project_id: { type: string }
        field_map:
          type: object
          description: Declarative field mapping {status, priority, ...}.
        sync_mode:
          type: string
          enum: [domio_wins, task_wins, last_write_wins]
        last_synced_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ──────────────────────────────────────────────────────────────────────
    # Guests
    # ──────────────────────────────────────────────────────────────────────
    GuestInput:
      type: object
      required: [guest_email, scope_type, scope_id, inviter_id]
      properties:
        guest_email:
          type: string
          format: email
          description: Email address of the external guest.
        scope_type:
          type: string
          enum: [folder, project, deck]
          description: Resource type the guest can access.
        scope_id:
          type: string
          description: UUID of the folder, project, or deck.
        capabilities:
          type: array
          items: { type: string, enum: [comment, suggest, view] }
          default: [comment, suggest, view]
          description: Guest capabilities. Download/export are never granted by default.
        expires_in_minutes:
          type: integer
          default: 15
          minimum: 1
          description: Magic link lifetime in minutes (default 15).
        inviter_id:
          type: string
          description: UUID of the workspace member creating the invitation.
    Guest:
      type: object
      required:
        [
          guest_access_id,
          inviter_id,
          guest_email,
          scope_type,
          scope_id,
          capabilities,
          expires_at,
          created_at,
        ]
      properties:
        guest_access_id: { type: string }
        inviter_id:
          { type: string, description: UUID of the workspace member who sent the invitation. }
        guest_email: { type: string, format: email }
        guest_user_id: { type: string, nullable: true, description: Populated on first sign-in. }
        scope_type: { type: string, enum: [folder, project, deck] }
        scope_id: { type: string }
        capabilities:
          type: array
          items: { type: string, enum: [comment, suggest, view] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
    MagicLinkConsumeInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Magic link token received in the invite email.
    MagicLinkConsumeResult:
      type: object
      required: [guest_access_id, scope_type, scope_id, capabilities, expires_at, guest_email]
      properties:
        guest_access_id: { type: string }
        scope_type: { type: string, enum: [folder, project, deck] }
        scope_id: { type: string }
        capabilities:
          type: array
          items: { type: string, enum: [comment, suggest, view] }
        expires_at: { type: string, format: date-time }
        guest_email: { type: string, format: email }
