openapi: 3.1.0
info:
  title: Domio Collab API (Phase 18 W1)
  version: 0.1.0
  description: |
    Collaboration & workflow data plane. REST CRUD over comments,
    approval requests, assignments, and permission grants.

    Auth model:
      - All endpoints require a workspace bearer session (cookie or
        `Authorization: Bearer ...`).
      - The actor identity is injected via the `x-actor-id` header
        by the API gateway; callers MUST NOT spoof it.
      - Capability checks are enforced at the handler level via
        `POST /v1/permissions/check`.

  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://api.domio.example.com
    description: Production
  - url: http://localhost:8087
    description: Local development
tags:
  - name: comments
    description: Threaded comments with reactions and attachments.
  - name: approvals
    description: Multi-lane approval workflows with SLA policy.
  - name: assignments
    description: Task assignments with slide ranges, watchers, and status tracking.
  - name: permissions
    description: Fine-grained RBAC permission grants with deny-first + temporal evaluation.
  - name: library
    description: Slide library — reusable slide templates with versioning and approval workflows.
  - name: auto-update
    description: Auto-update bindings that sync consumer slides to library entries.
  - name: expiry
    description: Expiry policies, freshness flags, and content lifecycle dashboard.
  - name: suggestions
    description: CRDT-operation suggestions on deck content — propose, accept, reject, or mark obsolete.
  - name: merge-requests
    description: Branch-based merge requests for deck content with diff computation and conflict resolution.
  - name: meeting
    description: Video meeting integrations — connect vendors, issue scoped tokens, record slide markers.
  - name: calendar
    description: Calendar links — schedule deck events with Google, Outlook, or iCloud.
  - name: guests
    description: External guest access — invite, manage, and revoke guest permissions on decks.
  - name: task-managers
    description: External task tracker links — bidirectional sync with Asana, Jira, and Linear.
paths:
  # ──────────────────────────────────────────────────────────────────────────
  # Comments
  # ──────────────────────────────────────────────────────────────────────────
  /v1/decks/{deck_id}/comments:
    parameters:
      - in: path
        name: deck_id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    post:
      tags: [comments]
      operationId: createComment
      summary: Create a new comment on a deck (or a specific slide/element).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400':
          description: Validation error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Deck not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []
    get:
      tags: [comments]
      operationId: listComments
      summary: List comments for a deck, optionally filtered by thread or status.
      parameters:
        - in: query
          name: thread_id
          required: false
          schema: { type: string }
          description: Filter to a specific thread.
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [open, resolved] }
          description: Filter by thread status.
      responses:
        '200':
          description: List of comments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Deck not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/comments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    patch:
      tags: [comments]
      operationId: updateComment
      summary: Update a comment's body or status (resolve/unresolve).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body_md:
                  type: string
                  description: New Markdown body.
                status:
                  type: string
                  enum: [open, resolved]
                  description: New thread status.
      responses:
        '200':
          description: Updated comment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400':
          description: Validation error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Comment not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/comments/{id}/resolved:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    post:
      tags: [comments]
      operationId: resolveComment
      summary: Mark a comment thread as resolved.
      responses:
        '200':
          description: Comment resolved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Comment not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/comments/{id}/reactions:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    post:
      tags: [comments]
      operationId: addReaction
      summary: Add an emoji reaction to a comment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji, user_id]
              properties:
                emoji:
                  type: string
                  description: The emoji shortcode.
                user_id:
                  type: string
                  description: UUID of the user adding the reaction.
      responses:
        '201':
          description: Reaction added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400':
          description: Validation error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Comment not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []
    delete:
      tags: [comments]
      operationId: removeReaction
      summary: Remove an emoji reaction from a comment.
      parameters:
        - in: query
          name: emoji
          required: true
          schema: { type: string }
          description: The emoji shortcode to remove.
        - in: query
          name: user_id
          required: true
          schema: { type: string }
          description: UUID of the user whose reaction to remove.
      responses:
        '200':
          description: Reaction removed.
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Comment or reaction not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  # ──────────────────────────────────────────────────────────────────────────
  # Approval Requests
  # ──────────────────────────────────────────────────────────────────────────
  /v1/decks/{deck_id}/approval-requests:
    parameters:
      - in: path
        name: deck_id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    post:
      tags: [approvals]
      operationId: createApprovalRequest
      summary: Create a new approval request for a deck version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRequestInput' }
      responses:
        '201':
          description: Approval request created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '400':
          description: Validation error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Deck not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: Active approval request already exists for this deck version.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []
    get:
      tags: [approvals]
      operationId: listApprovalRequests
      summary: List approval requests for a deck.
      responses:
        '200':
          description: List of approval requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApprovalRequest' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Deck not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/approval-requests/{id}/submit:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    post:
      tags: [approvals]
      operationId: submitApprovalRequest
      summary: Submit a draft approval request for review (draft → pending).
      responses:
        '200':
          description: Approval request submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '400':
          description: Request is not in draft status.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Approval request not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/approval-requests/{id}/decisions:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    post:
      tags: [approvals]
      operationId: recordDecision
      summary: Record an approver's decision on an approval request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionInput' }
      responses:
        '201':
          description: Decision recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalDecision' }
        '400':
          description: Validation error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Insufficient permissions or not an assigned approver.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Approval request not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: Approver has already decided on this lane.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  # ──────────────────────────────────────────────────────────────────────────
  # Assignments
  # ──────────────────────────────────────────────────────────────────────────
  /v1/decks/{deck_id}/assignments:
    parameters:
      - in: path
        name: deck_id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    post:
      tags: [assignments]
      operationId: createAssignment
      summary: Create a task assignment scoped to a slide range.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentInput' }
      responses:
        '201':
          description: Assignment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400':
          description: Validation error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Deck not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/assignments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    patch:
      tags: [assignments]
      operationId: updateAssignment
      summary: Update an assignment's status, due date, watchers, or blocked reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [not_started, in_progress, blocked, review, done]
                blocked_reason:
                  type: string
                  nullable: true
                due_at:
                  type: string
                  format: date-time
                  nullable: true
                watchers:
                  type: array
                  items: { type: string }
                  description: Replacement list of watcher user IDs.
      responses:
        '200':
          description: Updated assignment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400':
          description: Validation error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Assignment not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/users/{user_id}/assignments:
    parameters:
      - in: path
        name: user_id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    get:
      tags: [assignments]
      operationId: listUserAssignments
      summary: List all assignments for a user across the workspace.
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [not_started, in_progress, blocked, review, done] }
          description: Filter by assignment status.
      responses:
        '200':
          description: List of assignments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Assignment' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: User not found in workspace.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  # ──────────────────────────────────────────────────────────────────────────
  # Permissions
  # ──────────────────────────────────────────────────────────────────────────
  /v1/permissions/grants:
    get:
      tags: [permissions]
      operationId: listGrants
      summary: List permission grants, optionally filtered by resource.
      parameters:
        - in: query
          name: resource_type
          required: false
          schema: { type: string, enum: [workspace, folder, project, deck, slide] }
        - in: query
          name: resource_id
          required: false
          schema: { type: string }
        - in: header
          name: x-actor-id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of permission grants.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PermissionGrant' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []
    post:
      tags: [permissions]
      operationId: createGrant
      summary: Create a permission grant for a principal on a resource.
      parameters:
        - in: header
          name: x-actor-id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantInput' }
      responses:
        '201':
          description: Permission grant created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionGrant' }
        '400':
          description: Validation error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/permissions/check:
    post:
      tags: [permissions]
      operationId: checkPermission
      summary: Check whether an actor has a specific capability on a resource.
      parameters:
        - in: header
          name: x-actor-id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionCheckInput' }
      responses:
        '200':
          description: Permission evaluation result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionEvaluation' }
        '400':
          description: Validation error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Insufficient permissions to perform the check.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  # ──────────────────────────────────────────────────────────────────────────
  # Slide Library
  # ──────────────────────────────────────────────────────────────────────────
  /v1/library/entries:
    parameters:
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    post:
      tags: [library]
      operationId: createLibraryEntry
      summary: Create a new slide library entry with an initial version snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryEntryInput' }
      responses:
        '201':
          description: Library entry created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryEntry' }
        '400':
          description: Validation error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []
    get:
      tags: [library]
      operationId: listLibraryEntries
      summary: List library entries, optionally filtered by scope and status.
      parameters:
        - in: query
          name: scope
          required: false
          schema: { type: string, enum: [workspace, org, team] }
          description: Filter by scope.
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [draft, pending, approved, retired] }
          description: Filter by status.
      responses:
        '200':
          description: List of library entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LibraryEntry' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/library/entries/{id}/versions:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    post:
      tags: [library]
      operationId: addLibraryVersion
      summary: Add a new version snapshot to an existing library entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryVersionInput' }
      responses:
        '201':
          description: Library version created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryVersion' }
        '400':
          description: Validation error.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Library entry not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/library/entries/{id}/retire:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    post:
      tags: [library]
      operationId: retireLibraryEntry
      summary: Retire a library entry (optionally superseded by another entry).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                superseded_by:
                  type: string
                  nullable: true
                  description: ID of the replacement entry, if any.
      responses:
        '200':
          description: Library entry retired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryEntry' }
        '400':
          description: Entry is not in a retirable state.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Insufficient permissions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Library entry not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
      security:
        - bearerAuth: []
        - cookieAuth: []

  /v1/decks/{deck_id}/slides/insert-from-library:
    parameters:
      - in: path
        name: deck_id
        required: true
        schema: { type: string }
      - in: header
        name: x-actor-id
        required: true
        schema: { type: string }
    post:
      tags: [library]
      operationId: insertLibrarySlide
      summary: Insert a slide from the library into a deck (reference or copy mode).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [library_entry_id, mode]
              properties:
                library_entry_id:
                  type: string
                  description: ID of the library entry to insert from.
                version_id:
                  type: string
                  nullable: true
                  description: Specific version to use; null = latest approved.
                mode:
                  type: string
