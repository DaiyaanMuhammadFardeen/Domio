openapi: 3.1.0
info:
  title: Domio Recording API (Phase 21 W1)
  version: 0.1.0
  description: |
    Recording orchestration — start / pause / resume / stop / finalize
    lifecycle plus chunk-commit and read APIs.

    The recording-orchestrator service (`@domio/recording-orchestrator`)
    is transport-agnostic; this document binds it to REST. Chunk storage
    is owned by `@domio/object-store` (S3 + MinIO) and is referenced
    indirectly via `storage_key` on the commit payload.

    All write endpoints accept an `idempotency_key` (header or body) so
    that the orchestrator's `IdempotencyStore` can replay-safe dedup.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.domio.example
    description: Production (placeholder)
tags:
  - name: recording
    description: Recording session lifecycle and chunk commit.
paths:
  /v1/recording/sessions:
    post:
      tags: [recording]
      operationId: startRecording
      summary: Start a new recording session for an existing live session.
      description: |
        Creates a `recording_session` row in `pending` status, then
        immediately transitions to `recording`. The returned row
        carries the canonical `id` (used in all subsequent paths) and
        the initial `version` for optimistic concurrency.
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRecordingRequest'
      responses:
        '200':
          description: Recording session started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingSession'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'

  /v1/recording/sessions/{recordingSessionId}:
    get:
      tags: [recording]
      operationId: getRecording
      summary: Get a recording session.
      parameters:
        - in: path
          name: recordingSessionId
          required: true
          schema:
            type: string
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recording session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingSession'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'

  /v1/recording/sessions/{recordingSessionId}/pause:
    post:
      tags: [recording]
      operationId: pauseRecording
      summary: Pause an active recording.
      parameters:
        - in: path
          name: recordingSessionId
          required: true
          schema:
            type: string
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: Recording paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingSession'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '422':
          $ref: 'common.yaml#/components/responses/Unprocessable'

  /v1/recording/sessions/{recordingSessionId}/resume:
    post:
      tags: [recording]
      operationId: resumeRecording
      summary: Resume a paused recording.
      parameters:
        - in: path
          name: recordingSessionId
          required: true
          schema:
            type: string
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: Recording resumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingSession'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '422':
          $ref: 'common.yaml#/components/responses/Unprocessable'

  /v1/recording/sessions/{recordingSessionId}/stop:
    post:
      tags: [recording]
      operationId: stopRecording
      summary: Stop recording. Transitions to `finalizing`.
      parameters:
        - in: path
          name: recordingSessionId
          required: true
          schema:
            type: string
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: Recording transitioning to finalizing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingSession'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '422':
          $ref: 'common.yaml#/components/responses/Unprocessable'

  /v1/recording/sessions/{recordingSessionId}/finalize:
    post:
      tags: [recording]
      operationId: finalizeRecording
      summary: Finalize a recording. Transitions to `ready`.
      parameters:
        - in: path
          name: recordingSessionId
          required: true
          schema:
            type: string
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: Recording ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingSession'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '422':
          $ref: 'common.yaml#/components/responses/Unprocessable'

  /v1/recording/sessions/{recordingSessionId}/fail:
    post:
      tags: [recording]
      operationId: failRecording
      summary: Mark a recording as failed.
      parameters:
        - in: path
          name: recordingSessionId
          required: true
          schema:
            type: string
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailRequest'
      responses:
        '200':
          description: Recording failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingSession'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '422':
          $ref: 'common.yaml#/components/responses/Unprocessable'

  /v1/recording/sessions/{recordingSessionId}/chunks:
    post:
      tags: [recording]
      operationId: commitChunk
      summary: Commit a captured chunk under a lease.
      description: |
        Lease-based commit. The capture pipeline uploads the chunk bytes
        to `@domio/object-store` first, then calls this endpoint with
        the resulting `storage_key`, `sha256`, `byte_size`, and lease
        info. Replays are no-ops under the (track_kind, sequence)
        uniqueness constraint.
      parameters:
        - in: path
          name: recordingSessionId
          required: true
          schema:
            type: string
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitChunkRequest'
      responses:
        '200':
          description: Chunk committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitChunkResponse'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '422':
          $ref: 'common.yaml#/components/responses/Unprocessable'
    get:
      tags: [recording]
      operationId: listChunks
      summary: List the committed chunks for a recording.
      parameters:
        - in: path
          name: recordingSessionId
          required: true
          schema:
            type: string
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chunks returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkList'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'

components:
  schemas:
    StartRecordingRequest:
      type: object
      required: [workspace_id, session_id, presenter_user_id, storage_prefix]
      properties:
        workspace_id:
          type: string
        session_id:
          type: string
          description: The live presenter-session id this recording is for.
        presenter_user_id:
          type: string
        storage_prefix:
          type: string
          description: |
            Object-store prefix; convention `<workspace_id>/<recording_session_id>/`.
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        language:
          type: string
          default: en
        expires_at:
          type: string
          format: date-time
          nullable: true
        idempotency_key:
          type: string

    TransitionRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 0
        idempotency_key:
          type: string

    FailRequest:
      allOf:
        - $ref: '#/components/schemas/TransitionRequest'
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
              minLength: 1
              maxLength: 1024

    CommitChunkRequest:
      type: object
      required:
        [
          workspace_id,
          recording_session_id,
          track_kind,
          sequence,
          byte_size,
          duration_ms,
          sha256,
          storage_key,
          lease_id,
          lease_expires_at,
        ]
      properties:
        workspace_id:
          type: string
        recording_session_id:
          type: string
        track_kind:
          $ref: '#/components/schemas/TrackKind'
        sequence:
          type: integer
          format: int64
          minimum: 0
        byte_size:
          type: integer
          format: int64
          minimum: 0
        duration_ms:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          description: Hex-encoded SHA-256 of the chunk bytes.
        storage_key:
          type: string
        lease_id:
          type: string
        lease_expires_at:
          type: string
          format: date-time
        idempotency_key:
          type: string

    CommitChunkResponse:
      type: object
      required: [workspace_id, recording_session_id, track_kind, sequence]
      properties:
        workspace_id:
          type: string
        recording_session_id:
          type: string
        track_kind:
          $ref: '#/components/schemas/TrackKind'
        sequence:
          type: integer
          format: int64

    ChunkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChunkSummary'

    ChunkSummary:
      type: object
      required: [track_kind, sequence, byte_size]
      properties:
        track_kind:
          $ref: '#/components/schemas/TrackKind'
        sequence:
          type: integer
          format: int64
        byte_size:
          type: integer
          format: int64

    TrackKind:
      type: string
      enum: [screen, camera, mic, system_audio, slide_diff, widget_events, annotations]

    RecordingStatus:
      type: string
      enum: [pending, recording, paused, stopping, finalizing, ready, failed, expired, revoked]

    RecordingSession:
      type: object
      required:
        [
          id,
          workspace_id,
          session_id,
          presenter_user_id,
          status,
          started_at,
          paused_at,
          stopped_at,
          finalized_at,
          expires_at,
          storage_prefix,
          title,
          description,
          language,
          error,
          version,
        ]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        session_id:
          type: string
        presenter_user_id:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/RecordingStatus'
        started_at:
          type: string
          format: date-time
        paused_at:
          type: string
          format: date-time
          nullable: true
        stopped_at:
          type: string
          format: date-time
          nullable: true
        finalized_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        storage_prefix:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        language:
          type: string
        error:
          type: string
          nullable: true
        version:
          type: integer
          format: int64
