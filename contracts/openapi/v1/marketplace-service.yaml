openapi: 3.1.0
info:
  title: Domio Marketplace Service API (Phase 19 W1)
  version: 0.1.0
  description: |
    Marketplace listing lifecycle, pricing, reviews, and curated brand-locked
    listings for the Phase 19 creator economy.

    All endpoints require authentication via the bearer token or the session
    cookie.

    The operationIds in this file MUST match the handler names in the
    parallel services/marketplace service.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://api.domio.example.com
    description: Production (placeholder)
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: marketplace-listings
    description: Marketplace listing CRUD and lifecycle transitions.
  - name: marketplace-pricing
    description: Price calculation and payout policy.
  - name: marketplace-reviews
    description: Listing reviews, replies, and reporting.
  - name: marketplace-curated
    description: Brand-locked curated marketplace listings.
  - name: marketplace-checkout
    description: Purchase, refund, and payment webhook handling.
  - name: marketplace-creator
    description: Creator profile, KYC onboarding, and payout methods.
  - name: marketplace-payout
    description: Payout runs and payout policy.
  - name: marketplace-finance
    description: FX rates and financial data.
  - name: marketplace-analytics
    description: Creator analytics and statements.
  - name: marketplace-takedown
    description: Takedown requests, resolution, and counter-notice workflow.
paths:
  /v1/marketplace/listings:
    post:
      tags: [marketplace-listings]
      summary: Create a marketplace listing (draft)
      operationId: createMarketplaceListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceListingInput' }
      responses:
        '201':
          description: Draft listing created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceListing' }
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: Listing already exists for this catalog
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    get:
      tags: [marketplace-listings]
      summary: List marketplace listings
      operationId: listMarketplaceListings
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, in_review, published, deprecated, removed] }
        - name: seller_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Listing results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MarketplaceListing' } }
                  total: { type: integer }
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/marketplace/listings/{listing_id}:
    get:
      tags: [marketplace-listings]
      summary: Get a marketplace listing by ID
      operationId: getMarketplaceListing
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Listing details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceListing' }
        '404':
          description: Listing not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    patch:
      tags: [marketplace-listings]
      summary: Update a marketplace listing
      operationId: updateMarketplaceListing
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceListingInput' }
      responses:
        '200':
          description: Listing updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceListing' }
        '404':
          description: Listing not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/marketplace/listings/{listing_id}/submit:
    post:
      tags: [marketplace-listings]
      summary: Submit a draft listing for review (draft → in_review)
      operationId: submitMarketplaceListing
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '202':
          description: Listing submitted for review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceListing' }
        '404':
          description: Listing not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: Invalid status transition
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/marketplace/listings/{listing_id}/publish:
    post:
      tags: [marketplace-listings]
      summary: Publish a reviewed listing (in_review → published)
      operationId: publishMarketplaceListing
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Listing published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceListing' }
        '404':
          description: Listing not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: Invalid status transition
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/marketplace/listings/{listing_id}/deprecate:
    post:
      tags: [marketplace-listings]
      summary: Deprecate a published listing (published → deprecated)
      operationId: deprecateMarketplaceListing
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Listing deprecated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceListing' }
        '404':
          description: Listing not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: Invalid status transition
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/marketplace/listings/{listing_id}/versions:
    post:
      tags: [marketplace-listings]
      summary: Add a new version to a marketplace listing
      operationId: addMarketplaceListingVersion
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, changelog]
              properties:
                version: { type: string, minLength: 1, description: "Semver version (e.g. '1.1.0')." }
                changelog: { type: string, maxLength: 4096, description: "Human-readable changelog for this version." }
      responses:
        '201':
          description: Version added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingVersion' }
        '404':
          description: Listing not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/marketplace/listings/{listing_id}/changelog:
    get:
      tags: [marketplace-listings]
      summary: Get the changelog for a marketplace listing
      operationId: getMarketplaceListingChangelog
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Changelog entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChangelogEntry' }
        '404':
          description: Listing not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/marketplace/pricing/calculate:
    post:
      tags: [marketplace-pricing]
      summary: Calculate marketplace price for a given pricing model
      operationId: calculateMarketplacePrice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceCalculationInput' }
      responses:
        '200':
          description: Price calculation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceCalculationResult' }
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/marketplace/payout-policy:
    get:
      tags: [marketplace-pricing]
      summary: Get the current payout policy
      operationId: getPayoutPolicy
      responses:
        '200':
          description: Payout policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutPolicy' }

  /v1/marketplace/listings/{listing_id}/reviews:
    post:
      tags: [marketplace-reviews]
      summary: Submit a review for a marketplace listing
      description: |
        Reviews pass heuristic moderation (profanity, link density, caps ratio,
        repetition, trust score). Only verified buyers may submit reviews.
        Auto-flagged reviews return 202 and are processed by the moderator worker.
      operationId: submitMarketplaceReview
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201':
          description: Review accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '202':
          description: Queued for moderation (ERR_MODERATION_QUEUED)
        '400':
          description: Invalid rating or body too long
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Not a verified buyer (ERR_NOT_VERIFIED_BUYER)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    get:
      tags: [marketplace-reviews]
      summary: List reviews for a marketplace listing
      operationId: listMarketplaceReviews
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Review results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Review' } }
                  total: { type: integer }
        '404':
          description: Listing not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/marketplace/reviews/{review_id}/reply:
    post:
      tags: [marketplace-reviews]
      summary: Reply to a marketplace review (one reply per review, creator only)
      operationId: replyToMarketplaceReview
      parameters:
        - name: review_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '201':
          description: Reply created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewReply' }
        '409':
          description: Already replied (ERR_ALREADY_REPLIED)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/marketplace/reviews/{review_id}/report:
    post:
      tags: [marketplace-reviews]
      summary: Report a marketplace review as abusive
      operationId: reportMarketplaceReview
      parameters:
        - name: review_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '202':
          description: Report queued for moderation
        '404':
          description: Review not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/marketplace/curated:
    get:
      tags: [marketplace-curated]
      summary: Get brand-locked curated marketplace listings
      operationId: getCuratedMarketplaceListings
      parameters:
        - name: brand_kit_id
          in: query
          required: true
          schema: { type: string }
          description: Brand-kit identifier to filter curated listings for.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: Number of results to return.
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: Number of results to skip.
      responses:
        '200':
          description: Curated listing results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CuratedListingPage' }
        '400':
          description: Missing required brand_kit_id query parameter
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  # ── Marketplace Checkout (Phase 19 W2) ──────────────────────────────────

  /v1/marketplace/listings/{listing_id}/purchase:
    post:
      tags: [marketplace-checkout]
      summary: Initiate a purchase of a marketplace listing
      operationId: createPurchase
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseInput' }
      responses:
        '201':
          description: Purchase initiated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseInitiation' }
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Not authorized to purchase
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Listing not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: Duplicate idempotency key (ERR_IDEMPOTENCY_KEY_REUSED)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Payment provider unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/marketplace/purchases/{purchase_id}/refund:
    post:
      tags: [marketplace-checkout]
      summary: Request a refund for a completed purchase
      operationId: requestRefund
      parameters:
        - name: purchase_id
          in: path
          required: true
          schema: { type: string }
          description: Purchase identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 4096, description: "Reason for the refund request." }
      responses:
        '202':
          description: Refund request accepted for processing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundRequest' }
        '404':
          description: Purchase not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: Refund already exists or outside refund window (ERR_REFUND_INVALID)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Payment provider unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/marketplace/webhooks/stripe:
    post:
      tags: [marketplace-checkout]
      summary: Receive a Stripe webhook event
      operationId: receiveStripeWebhook
      description: |
        Inbound webhook receiver for Stripe. Signature is verified at the API
        gateway layer via `X-Stripe-Signature` header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event payload.
      responses:
        '200':
          description: Webhook acknowledged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookReceipt' }
        '401':
          description: Signature verification failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/marketplace/webhooks/bkash:
    post:
      tags: [marketplace-checkout]
      summary: Receive a bKash webhook event
      operationId: receiveBkashWebhook
      description: |
        Inbound webhook receiver for bKash payment notifications. Signature is
        verified at the API gateway layer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw bKash notification payload.
      responses:
        '200':
          description: Webhook acknowledged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookReceipt' }
        '401':
          description: Signature verification failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/marketplace/webhooks/nagad:
    post:
      tags: [marketplace-checkout]
      summary: Receive a Nagad webhook event
      operationId: receiveNagadWebhook
      description: |
        Inbound webhook receiver for Nagad payment notifications. Signature is
        verified at the API gateway layer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Nagad notification payload.
      responses:
        '200':
          description: Webhook acknowledged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookReceipt' }
        '401':
          description: Signature verification failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  # ── Creator Profile (Phase 19 W3) ───────────────────────────────────────

  /v1/creator/profile:
    get:
      tags: [marketplace-creator]
      summary: Get the authenticated creator's profile
      operationId: getCreatorProfile
      responses:
        '200':
          description: Creator profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorProfile' }
        '403':
          description: Not a creator (ERR_NOT_CREATOR)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Creator profile not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Service unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    patch:
      tags: [marketplace-creator]
      summary: Update the authenticated creator's profile
      operationId: updateCreatorProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatorProfileUpdate' }
      responses:
        '200':
          description: Creator profile updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorProfile' }
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Not a creator (ERR_NOT_CREATOR)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Creator profile not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Service unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/creator/kyc/start:
    post:
      tags: [marketplace-creator]
      summary: Start a new KYC verification session
      operationId: startKycSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor]
              properties:
                vendor: { type: string, description: "KYC vendor to use (e.g. 'persona', 'sumsub')." }
      responses:
        '200':
          description: KYC session started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycSessionStart' }
        '400':
          description: Invalid vendor or creator not eligible
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Not a creator (ERR_NOT_CREATOR)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: Active KYC session already in progress (ERR_KYC_SESSION_ACTIVE)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: KYC vendor unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/creator/kyc/status:
    get:
      tags: [marketplace-creator]
      summary: Get current KYC session status for the creator
      operationId: getKycStatus
      responses:
        '200':
          description: KYC status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycStatusResult' }
        '403':
          description: Not a creator (ERR_NOT_CREATOR)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: No KYC session found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: KYC vendor unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/creator/payout-methods:
    post:
      tags: [marketplace-creator]
      summary: Add a new payout method for the creator
      operationId: createCreatorPayoutMethod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, external_account_id]
              properties:
                kind: { type: string, enum: [stripe_connect, bkash, nagad, bank], description: "Payout method type." }
                external_account_id: { type: string, description: "Provider-side account identifier." }
                metadata: { type: object, description: "Provider-specific metadata." }
      responses:
        '201':
          description: Payout method created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorPayoutMethod' }
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Not a creator (ERR_NOT_CREATOR)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Service unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    get:
      tags: [marketplace-creator]
      summary: List payout methods for the creator
      operationId: listCreatorPayoutMethods
      responses:
        '200':
          description: Payout methods
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CreatorPayoutMethod' }
        '403':
          description: Not a creator (ERR_NOT_CREATOR)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Service unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/creator/payout/connect-link:
    post:
      tags: [marketplace-creator]
      summary: Generate a Stripe Connect onboarding link
      operationId: getPayoutConnectLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [return_url]
              properties:
                return_url: { type: string, format: uri, description: "URL to redirect after onboarding." }
      responses:
        '200':
          description: Connect link generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutConnectLink' }
        '403':
          description: Not a creator (ERR_NOT_CREATOR)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Creator profile not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Stripe unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  # ── Payouts (Phase 19 W3) ──────────────────────────────────────────────

  /v1/payouts:
    get:
      tags: [marketplace-payout]
      summary: List payout runs for the creator
      operationId: listPayoutRuns
      parameters:
        - name: period_month
          in: query
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
          description: Filter by period (YYYY-MM).
      responses:
        '200':
          description: Payout runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PayoutRun' }
        '403':
          description: Not a creator (ERR_NOT_CREATOR)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Service unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/payouts/{run_id}:
    get:
      tags: [marketplace-payout]
      summary: Get a specific payout run
      operationId: getPayoutRun
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
          description: Payout run identifier.
      responses:
        '200':
          description: Payout run details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutRun' }
        '403':
          description: Not a creator (ERR_NOT_CREATOR)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Payout run not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Service unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  # ── FX (Phase 19 W3) ───────────────────────────────────────────────────

  /v1/fx/rates:
    get:
      tags: [marketplace-finance]
      summary: Get current FX rate between two currencies
      operationId: getFxRate
      parameters:
        - name: base
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Z]{3}$' }
          description: Base currency (e.g. USD).
        - name: quote
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Z]{3}$' }
          description: Quote currency (e.g. BDT).
      responses:
        '200':
          description: FX rate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxRate' }
        '400':
          description: Invalid currency pair
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: FX provider unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  # ── Analytics (Phase 19 W3) ────────────────────────────────────────────

  /v1/creator/analytics:
    get:
      tags: [marketplace-analytics]
      summary: Get analytics for the creator's listings in a period
      operationId: getCreatorAnalytics
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
          description: Period in YYYY-MM format.
      responses:
        '200':
          description: Creator analytics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorAnalytics' }
        '400':
          description: Invalid period format
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: Not a creator (ERR_NOT_CREATOR)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Service unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/creator/statements:
    get:
      tags: [marketplace-analytics]
      summary: List tax statements for the creator
      operationId: listCreatorStatements
      responses:
        '200':
          description: Statement summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StatementSummary' }
        '403':
          description: Not a creator (ERR_NOT_CREATOR)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Service unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/creator/statements/{statement_id}:
    get:
      tags: [marketplace-analytics]
      summary: Get a specific tax statement
      operationId: getCreatorStatement
      parameters:
        - name: statement_id
          in: path
          required: true
          schema: { type: string }
          description: Statement identifier.
      responses:
        '200':
          description: Statement summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementSummary' }
        '403':
          description: Not a creator (ERR_NOT_CREATOR)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Statement not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Service unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  # ── Takedowns (Phase 19 W4) ────────────────────────────────────────────

  /v1/takedowns:
    post:
      tags: [marketplace-takedown]
      summary: File a takedown request against a marketplace listing
      operationId: fileTakedown
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TakedownInput' }
      responses:
        '201':
          description: Takedown request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TakedownRequest' }
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: Listing not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Service unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    get:
      tags: [marketplace-takedown]
      summary: List takedown requests
      operationId: listTakedownRequests
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [received, in_review, confirmed, dismissed, counter_notice, resolved] }
        - name: kind
          in: query
          schema: { type: string, enum: [dmca, trademark, policy] }
      responses:
        '200':
          description: Takedown request list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TakedownRequestList' }

  /v1/takedowns/{request_id}:
    get:
      tags: [marketplace-takedown]
      summary: Get a takedown request by ID
      operationId: getTakedownRequest
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string }
          description: Takedown request identifier.
      responses:
        '200':
          description: Takedown request details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TakedownRequest' }
        '404':
          description: Takedown request not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/takedowns/{request_id}/resolve:
    post:
      tags: [marketplace-takedown]
      summary: Resolve a takedown request
      operationId: resolveTakedownRequest
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string }
          description: Takedown request identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveTakedownInput' }
      responses:
        '200':
          description: Takedown request resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TakedownRequest' }
        '404':
          description: Takedown request not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: Invalid status transition
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /v1/takedowns/{request_id}/counter-notice:
    post:
      tags: [marketplace-takedown]
      summary: Submit a counter-notice for a takedown request
      operationId: submitCounterNotice
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string }
          description: Takedown request identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounterNoticeInput' }
      responses:
        '200':
          description: Counter-notice submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TakedownRequest' }
        '404':
          description: Takedown request not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: Counter-notice not allowed for current status
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  # ── Brand Locks (Phase 19 W4) ──────────────────────────────────────────

  /v1/marketplace/brand-locks:
    post:
      tags: [marketplace-curated]
      summary: Create a brand lock for a marketplace listing
      operationId: createBrandLock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandLockInput' }
      responses:
        '201':
          description: Brand lock created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandLock' }
        '409':
          description: Brand lock already exists for this listing and brand kit
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '503':
          description: Service unavailable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    get:
      tags: [marketplace-curated]
      summary: List brand locks
      operationId: listBrandLocks
      parameters:
        - name: brand_kit_id
          in: query
          schema: { type: string }
          description: Filter by brand kit identifier.
      responses:
        '200':
          description: Brand lock list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandLockList' }

  /v1/marketplace/brand-locks/{brand_lock_id}:
    delete:
      tags: [marketplace-curated]
      summary: Delete a brand lock
      operationId: deleteBrandLock
      parameters:
        - name: brand_lock_id
          in: path
          required: true
          schema: { type: string }
          description: Brand lock identifier.
      responses:
        '204':
          description: Brand lock deleted
        '404':
          description: Brand lock not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

# ════════════════════════════════════════════════════════════════════════════
# Components
# ════════════════════════════════════════════════════════════════════════════
components:
  parameters:
    ListingId:
      name: listing_id
      in: path
      required: true
      schema: { type: string }
      description: Marketplace listing identifier.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  schemas:
    # ── RFC-7807 ──────────────────────────────────────────────────────────
    ProblemDetail:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the problem type.
          example: "https://domio.example/problems/not-found"
        title:
          type: string
          description: Short human-readable summary.
          example: "Resource not found"
        status:
          type: integer
          description: HTTP status code.
          example: 404
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: "Listing with id 'lst-abc' does not exist."
        instance:
          type: string
          format: uri
          description: URI reference identifying the specific occurrence.
          example: "https://api.domio.example.com/v1/marketplace/listings/lst-abc"

    # ── Marketplace Listing ────────────────────────────────────────────────
    MarketplaceListingInput:
      type: object
      required: [catalog_id, seller_id, title, kind, license_id, price]
      properties:
        catalog_id: { type: string, minLength: 1, description: "Catalog entry identifier." }
        seller_id: { type: string, minLength: 1, description: "Creator selling this listing." }
        title: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [component, template, theme, sticker_pack, icon_pack] }
        license_id: { type: string, minLength: 1, description: "License identifier for this listing." }
        description: { type: string, maxLength: 4096 }
        tags: { type: array, items: { type: string, maxLength: 40 }, default: [] }
        price:
          type: object
          required: [model, price_cents, currency]
          properties:
            model: { type: string, enum: [free, one_time, subscription, team_seats, enterprise_quote] }
            price_cents: { type: integer, minimum: 0 }
            currency: { type: string, pattern: '^[A-Z]{3}$' }

    MarketplaceListing:
      type: object
      properties:
        id: { type: string }
        catalog_id: { type: string }
        seller_id: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [draft, in_review, published, deprecated, removed] }
        is_free: { type: boolean }
        price_cents: { type: integer }
        currency: { type: string }
        tags: { type: array, items: { type: string } }
        preview:
          type: object
          properties:
            poster_ref: { type: string }
            loop_ref: { type: string }
        published_at_ms: { type: integer }
        deprecated_at_ms: { type: integer }
        version: { type: string }
        created_at: { type: integer }
        updated_at: { type: integer }

    ListingVersion:
      type: object
      properties:
        version: { type: string }
        changelog: { type: string }
        created_at: { type: integer }
        created_by: { type: string }

    ChangelogEntry:
      type: object
      properties:
        version: { type: string }
        changelog: { type: string }
        created_at: { type: integer }

    # ── Pricing ────────────────────────────────────────────────────────────
    PriceCalculationInput:
      type: object
      required: [model, price_cents, currency]
      properties:
        model: { type: string, enum: [free, one_time, subscription, team_seats, enterprise_quote] }
        price_cents: { type: integer, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        license_scope: { type: string, enum: [single_seat, team_n_seats, enterprise_pool] }
        team_seats: { type: integer, minimum: 1 }

    PriceCalculationResult:
      type: object
      required: [gross_cents, fee_cents, net_cents, currency, fx_rate, fx_timestamp]
      properties:
        model: { type: string, enum: [free, one_time, subscription, team_seats, enterprise_quote] }
        gross_cents: { type: integer, description: "Gross amount in integer cents." }
        fee_cents: { type: integer, description: "Platform fee in integer cents." }
        net_cents: { type: integer, description: "Net amount to creator in integer cents." }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        fx_rate: { type: number, description: "FX rate locked at invoice time." }
        fx_timestamp: { type: integer, description: "Epoch milliseconds of FX rate snapshot." }
        license_scope: { type: string, enum: [single_seat, team_n_seats, enterprise_pool] }

    # ── Payout Policy ──────────────────────────────────────────────────────
    PayoutPolicy:
      type: object
      properties:
        split_creator_bps: { type: integer, description: "Basis points for creator share (7000 = 70%)." }
        split_platform_bps: { type: integer, description: "Basis points for platform share (3000 = 30%)." }
        min_payout_cents: { type: integer, description: "Minimum payout threshold in integer cents." }
        first_payout_hold_days: { type: integer, description: "Hold period for first-ever payout." }
        updated_at: { type: integer }

    # ── Reviews ────────────────────────────────────────────────────────────
    ReviewInput:
      type: object
      required: [rating, body]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, minLength: 1, maxLength: 4096 }

    Review:
      type: object
      properties:
        id: { type: string }
        listing_id: { type: string }
        reviewer_id: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string }
        status: { type: string, enum: [queued, accepted, auto_flagged, removed] }
        verified_buyer: { type: boolean }
        created_at: { type: integer }

    ReviewReply:
      type: object
      properties:
        id: { type: string }
        review_id: { type: string }
        replier_id: { type: string }
        body: { type: string }
        created_at: { type: integer }

    # ── Curated Listing ────────────────────────────────────────────────────
    CuratedListing:
      type: object
      required: [listing_id, title, slug, is_free, price_cents, currency, brand_locked_state]
      properties:
        listing_id: { type: string, description: "Marketplace listing identifier." }
        title: { type: string, description: "Listing title." }
        slug: { type: string, description: "URL-safe listing slug." }
        is_free: { type: boolean, description: "Whether the listing is free." }
        price_cents: { type: integer, description: "Listing price in integer cents." }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: "ISO 4217 currency code." }
        override_price_cents: { type: integer, nullable: true, description: "Per-brand price override in integer cents." }
        brand_locked_state: { type: string, enum: [allow, override], description: "Brand-lock curation state." }

    # ── Checkout (Phase 19 W2) ──────────────────────────────────────────
    PurchaseInput:
      type: object
      required: [listing_id, provider, currency, idempotency_key]
      properties:
        listing_id: { type: string, minLength: 1, description: "Marketplace listing to purchase." }
        provider: { type: string, enum: [stripe, bkash, nagad], description: "Payment provider." }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: "ISO 4217 currency code." }
        idempotency_key: { type: string, minLength: 1, description: "Client-generated idempotency key (UUID v4/v7). Prevents duplicate charges." }
        quantity: { type: integer, minimum: 1, default: 1, description: "Number of seats/licenses to purchase." }
        success_url: { type: string, format: uri, description: "Redirect URL after successful payment." }
        cancel_url: { type: string, format: uri, description: "Redirect URL if the buyer cancels." }

    PurchaseInitiation:
      type: object
      required: [purchase_id, provider, status, expires_at]
      properties:
        purchase_id: { type: string, description: "Application-level purchase identifier." }
        provider: { type: string, enum: [stripe, bkash, nagad], description: "Payment provider used." }
        provider_intent_id: { type: string, description: "Provider-side payment intent identifier." }
        checkout_url: { type: string, format: uri, nullable: true, description: "Provider checkout URL. Null for redirect-less flows (e.g., bKash token collection)." }
        status: { type: string, enum: [pending, processing, succeeded, failed, expired], description: "Current purchase status." }
        expires_at: { type: integer, description: "Epoch milliseconds when this purchase intent expires." }

    RefundRequest:
      type: object
      required: [purchase_id, refund_status, auto_approved, review_required]
      properties:
        purchase_id: { type: string, description: "Original purchase identifier." }
        refund_status: { type: string, enum: [pending, approved, rejected, processing, completed], description: "Current refund status." }
        auto_approved: { type: boolean, description: "True if refund was auto-approved (within 14-day window and usage < 5 inserts)." }
        review_required: { type: boolean, description: "True if the refund requires admin review." }

    WebhookReceipt:
      type: object
      required: [received]
      properties:
        received: { type: boolean, description: "Always true when the webhook is acknowledged." }

    # ── Creator Profile (Phase 19 W3) ────────────────────────────────────
    CreatorProfile:
      type: object
      required: [user_id, display_name, slug, kyc_status, payout_ready, onboarding_state, currency]
      properties:
        user_id: { type: string, description: "Platform user identifier." }
        display_name: { type: string, description: "Public display name." }
        slug: { type: string, description: "URL-safe creator slug." }
        bio: { type: string, description: "Creator biography." }
        country_code: { type: string, pattern: '^[A-Z]{2}$', description: "ISO 3166-1 alpha-2 country code." }
        payout_method: { type: string, enum: [stripe_connect, bkash, nagad, bank], description: "Default payout method." }
        payout_ready: { type: boolean, description: "True if creator can receive payouts." }
        kyc_status: { type: string, enum: [pending, approved, rejected, expired], description: "Current KYC verification status." }
        balance_cents: { type: integer, description: "Accumulated unpaid balance in integer cents." }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: "ISO 4217 currency code." }
        onboarding_state: { type: string, enum: [pending, profile_complete, kyc_required, kyc_submitted, kyc_approved, payout_ready, active], description: "Current onboarding funnel state." }
        created_at_ms: { type: integer, description: "Profile creation timestamp (epoch ms)." }
        updated_at_ms: { type: integer, description: "Last update timestamp (epoch ms)." }

    CreatorProfileUpdate:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        bio: { type: string, maxLength: 4096 }
        country_code: { type: string, pattern: '^[A-Z]{2}$', description: "ISO 3166-1 alpha-2 country code." }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: "ISO 4217 currency code." }

    KycSessionStart:
      type: object
      required: [kyc_session_id, session_url]
      properties:
        kyc_session_id: { type: string, description: "KYC session identifier." }
        session_url: { type: string, format: uri, description: "URL to redirect the creator to the KYC vendor." }

    KycStatusResult:
      type: object
      required: [kyc_session_id, status, onboarding_state]
      properties:
        kyc_session_id: { type: string, description: "KYC session identifier." }
        status: { type: string, enum: [pending, submitted, approved, rejected], description: "Current KYC session status." }
        onboarding_state: { type: string, enum: [pending, profile_complete, kyc_required, kyc_submitted, kyc_approved, payout_ready, active], description: "Creator onboarding state." }

    CreatorPayoutMethod:
      type: object
      required: [id, creator_id, kind, verified, external_account_id]
      properties:
        id: { type: string, description: "Payout method identifier." }
        creator_id: { type: string, description: "Owner creator identifier." }
        kind: { type: string, enum: [stripe_connect, bkash, nagad, bank], description: "Payout method type." }
        verified: { type: boolean, description: "True if provider has confirmed the account." }
        external_account_id: { type: string, description: "Provider-side account identifier." }
        metadata: { type: object, description: "Provider-specific metadata." }
        created_at_ms: { type: integer, description: "Creation timestamp (epoch ms)." }
        updated_at_ms: { type: integer, description: "Last update timestamp (epoch ms)." }

    PayoutConnectLink:
      type: object
      required: [connect_url, expires_at]
      properties:
        connect_url: { type: string, format: uri, description: "Stripe Connect onboarding URL." }
        expires_at: { type: integer, description: "Epoch milliseconds when the link expires." }

    # ── Payout Runs (Phase 19 W3) ────────────────────────────────────────
    PayoutRun:
      type: object
      required: [id, period_month, status, total_creators, total_payout_cents, currency]
      properties:
        id: { type: string, description: "Payout run identifier." }
        period_month: { type: string, pattern: "^\\d{4}-\\d{2}$", description: "Period in YYYY-MM format." }
        status: { type: string, enum: [pending, processing, completed, failed], description: "Payout run status." }
        total_creators: { type: integer, description: "Number of creators included in this run." }
        total_payout_cents: { type: integer, description: "Total payout amount in integer cents." }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: "ISO 4217 currency code." }
        created_at_ms: { type: integer, description: "Run creation timestamp (epoch ms)." }
        completed_at_ms: { type: integer, description: "Run completion timestamp (epoch ms)." }

    # ── FX (Phase 19 W3) ─────────────────────────────────────────────────
    FxRate:
      type: object
      required: [base, quote, rate, fetched_at, source]
      properties:
        base: { type: string, pattern: '^[A-Z]{3}$', description: "Base currency code." }
        quote: { type: string, pattern: '^[A-Z]{3}$', description: "Quote currency code." }
        rate: { type: number, description: "Exchange rate (quote per base)." }
        fetched_at: { type: integer, description: "Epoch milliseconds when the rate was fetched." }
        source: { type: string, description: "FX rate data provider (e.g. 'openexchangerates')." }

    # ── Creator Analytics (Phase 19 W3) ──────────────────────────────────
    CreatorAnalytics:
      type: object
      required: [creator_id, period, downloads, installs, mrr_cents, conversion_rate, refund_rate, top_geos]
      properties:
        creator_id: { type: string, description: "Creator identifier." }
        period: { type: string, pattern: "^\\d{4}-\\d{2}$", description: "Period in YYYY-MM format." }
        downloads: { type: integer, description: "Total downloads across all listings." }
        installs: { type: integer, description: "Total installs across all listings." }
        mrr_cents: { type: integer, description: "Monthly recurring revenue in integer cents." }
        conversion_rate: { type: number, description: "Listing view-to-install conversion rate (0.0–1.0)." }
        refund_rate: { type: number, description: "Refund rate (0.0–1.0)." }
        top_geos:
          type: array
          items:
            type: object
            required: [country_code, installs]
            properties:
              country_code: { type: string, pattern: '^[A-Z]{2}$', description: "ISO 3166-1 alpha-2 country code." }
              installs: { type: integer, description: "Install count for this country." }
          description: "Top geographies by install count."
        listings: { type: integer, description: "Number of active listings." }
        avg_rating: { type: number, description: "Average review rating across all listings." }
        created_at_ms: { type: integer, description: "Analytics snapshot timestamp (epoch ms)." }

    # ── Statements (Phase 19 W3) ─────────────────────────────────────────
    StatementSummary:
      type: object
      required: [statement_id, creator_id, period_month, kind, total_gross_cents, total_fee_cents, total_net_cents, currency, generated_at]
      properties:
        statement_id: { type: string, description: "Statement identifier." }
        creator_id: { type: string, description: "Creator identifier." }
        period_month: { type: string, pattern: "^\\d{4}-\\d{2}$", description: "Period in YYYY-MM format." }
        kind: { type: string, enum: [monthly, yearly_1099k], description: "Statement type." }
        total_gross_cents: { type: integer, description: "Total gross revenue in integer cents." }
        total_fee_cents: { type: integer, description: "Total platform fees in integer cents." }
        total_net_cents: { type: integer, description: "Total net payout in integer cents." }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: "ISO 4217 currency code." }
        generated_at: { type: integer, description: "Epoch milliseconds when the statement was generated." }

    # ── Takedowns (Phase 19 W4) ──────────────────────────────────────────
    TakedownInput:
      type: object
      required: [listing_id, claimant_id, kind, statement]
      properties:
        listing_id: { type: string, minLength: 1, description: "Target marketplace listing identifier." }
        claimant_id: { type: string, minLength: 1, description: "Identifier of the party filing the takedown." }
        kind: { type: string, enum: [dmca, trademark, policy], description: "Type of takedown request." }
        evidence_url: { type: string, format: uri, description: "URL to supporting evidence document." }
        statement: { type: string, minLength: 1, maxLength: 4096, description: "Takedown statement or justification." }
        email: { type: string, format: email, description: "Contact email for the claimant." }

    TakedownRequest:
      type: object
      required: [request_id, listing_id, claimant_id, kind, statement, status, submitted_at]
      properties:
        request_id: { type: string, description: "Takedown request identifier." }
        listing_id: { type: string, description: "Target marketplace listing identifier." }
        claimant_id: { type: string, description: "Identifier of the party filing the takedown." }
        kind: { type: string, enum: [dmca, trademark, policy], description: "Type of takedown request." }
        evidence_url: { type: string, format: uri, nullable: true, description: "URL to supporting evidence document." }
        statement: { type: string, description: "Takedown statement or justification." }
        status: { type: string, enum: [received, in_review, confirmed, dismissed, counter_notice, resolved], description: "Current takedown status." }
        resolution_notes: { type: string, nullable: true, description: "Notes from the resolution process." }
        submitted_at: { type: integer, description: "Epoch milliseconds when the takedown was submitted." }
        resolved_at: { type: integer, nullable: true, description: "Epoch milliseconds when the takedown was resolved." }

    TakedownRequestList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TakedownRequest' }, description: "List of takedown requests." }
        total: { type: integer, description: "Total number of matching takedown requests." }

    ResolveTakedownInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [confirmed, dismissed], description: "Resolution decision." }
        resolution_notes: { type: string, maxLength: 4096, description: "Optional notes for the resolution." }

    CounterNoticeInput:
      type: object
      required: [statement]
      properties:
        statement: { type: string, minLength: 1, maxLength: 4096, description: "Counter-notice statement." }

    # ── Brand Locks (Phase 19 W4) ────────────────────────────────────────
    BrandLockInput:
      type: object
      required: [tenant_id, brand_kit_id, marketplace_listing_id, state]
      properties:
        tenant_id: { type: string, minLength: 1, description: "Tenant identifier." }
        brand_kit_id: { type: string, minLength: 1, description: "Brand kit identifier." }
        marketplace_listing_id: { type: string, minLength: 1, description: "Marketplace listing identifier." }
        state: { type: string, enum: [allow, deny, override], description: "Brand-lock curation state." }
        override_price_cents: { type: integer, minimum: 0, description: "Per-brand price override in integer cents." }
        notes: { type: string, maxLength: 4096, description: "Optional notes about this brand lock." }

    BrandLock:
      type: object
      required: [id, tenant_id, brand_kit_id, marketplace_listing_id, state, created_at]
      properties:
        id: { type: string, description: "Brand lock identifier." }
        tenant_id: { type: string, description: "Tenant identifier." }
        brand_kit_id: { type: string, description: "Brand kit identifier." }
        marketplace_listing_id: { type: string, description: "Marketplace listing identifier." }
        state: { type: string, enum: [allow, deny, override], description: "Brand-lock curation state." }
        override_price_cents: { type: integer, nullable: true, description: "Per-brand price override in integer cents." }
        notes: { type: string, nullable: true, description: "Optional notes about this brand lock." }
        created_at: { type: integer, description: "Epoch milliseconds when the brand lock was created." }

    BrandLockList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/BrandLock' }, description: "List of brand locks." }
        total: { type: integer, description: "Total number of matching brand locks." }

    # ── Curated Listing (Phase 19 W4 update) ─────────────────────────────
    CuratedListingPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CuratedListing' }
          description: "Curated listing results."
        total: { type: integer, description: "Total number of matching curated listings." }
