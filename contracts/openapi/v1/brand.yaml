openapi: 3.1.0
info:
  title: Domio Brand API
  version: 1.0.0
  description: |
    Brand kit management for Phase 07. CRUD operations for brand kits,
    brand context, and extraction jobs.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: brands
    description: Brand kit CRUD operations.
  - name: extraction
    description: AI-driven brand extraction from URLs.
security:
  - bearerAuth: []
paths:
  /v1/brands/{brand_kit_id}:
    get:
      tags: [brands]
      operationId: getBrandKit
      summary: Get a brand kit
      parameters:
        - in: path
          name: brand_kit_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Brand kit details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandKit'
        '404':
          description: Brand kit not found.
    put:
      tags: [brands]
      operationId: updateBrandKit
      summary: Update a brand kit
      parameters:
        - in: path
          name: brand_kit_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandKit'
      responses:
        '200':
          description: Brand kit updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandKit'
        '404':
          description: Brand kit not found.
  /v1/brands:
    get:
      tags: [brands]
      operationId: listBrandKits
      summary: List brand kits for an organization
      parameters:
        - in: query
          name: org_id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of brand kits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBrandKitsResponse'
    post:
      tags: [brands]
      operationId: createBrandKit
      summary: Create a new brand kit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandKit'
      responses:
        '201':
          description: Brand kit created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandKit'
  /v1/brands/extraction:
    post:
      tags: [extraction]
      operationId: startExtraction
      summary: Start AI brand extraction from a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgId, url]
              properties:
                orgId:
                  type: string
                url:
                  type: string
                  format: uri
      responses:
        '202':
          description: Extraction job started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandExtractionJob'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    BrandKit:
      type: object
      required: [name, ownerOrgId, scope, status]
      properties:
        id:
          type: string
        name:
          type: string
        ownerOrgId:
          type: string
        scope:
          type: string
          enum: [org, workspace, team]
        status:
          type: string
          enum: [draft, published, archived]
        logos:
          type: array
          items:
            $ref: '#/components/schemas/LogoAsset'
        palettes:
          type: array
          items:
            $ref: '#/components/schemas/Palette'
    LogoAsset:
      type: object
      properties:
        variant:
          type: string
          enum: [light, dark, mono]
        size:
          type: string
          enum: [small, medium, large, full]
        format:
          type: string
          enum: [svg, png, webp]
        assetUrl:
          type: string
          format: uri
        contentHash:
          type: string
        clearSpacePx:
          type: integer
    Palette:
      type: object
      properties:
        tokenIds:
          type: array
          items:
            type: string
        cvSafe:
          type: boolean
        hueSpacingDeg:
          type: number
    BrandExtractionJob:
      type: object
      properties:
        jobId:
          type: string
        orgId:
          type: string
        url:
          type: string
          format: uri
        status:
          type: string
          enum: [pending, running, completed, failed]
        stages:
          type: array
          items:
            type: string
        confidenceScores:
          type: object
          additionalProperties:
            type: number
    ListBrandKitsResponse:
      type: object
      properties:
        brandKits:
          type: array
          items:
            $ref: '#/components/schemas/BrandKit'
        pageInfo:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            totalItems:
              type: integer
            hasNext:
              type: boolean
