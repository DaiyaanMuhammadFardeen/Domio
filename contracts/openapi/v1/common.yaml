openapi: 3.1.0
info:
  title: Domio Common API
  version: 1.0.0
  description: |
    Common REST endpoints shared by every Domio service. Health and
    readiness endpoints are the only stable public surface in Phase 0;
    authentication is a stub returning a hard-coded test user.

    Internal service-to-service traffic uses gRPC and Protobuf (see
    `contracts/proto/`). External clients use REST + this OpenAPI spec.

    All non-idempotent endpoints require the `Idempotency-Key` header.
    The same key with the same request body returns the cached response
    within 24 hours. Different bodies with the same key return 409
    Conflict with code `idempotency_key_conflict`.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Domio Engineering
    url: https://github.com/DaiyaanMuhammadFardeen/Domio
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.domio.example
    description: Production (placeholder)
tags:
  - name: health
    description: Health and readiness checks.
  - name: auth
    description: Authentication stub (replaced by full SSO/SCIM in P20).
  - name: decks
    description: Deck surface (placeholder; full schema lands in P02).
security: []
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Process liveness
      description: |
        Returns 200 as long as the process is alive and serving HTTP.
        Does NOT check downstream dependencies. Use `/readyz` for that.
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzResponse"
        "503":
          description: Process is shutting down or unhealthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: Process readiness
      description: |
        Returns 200 when the process is ready to serve traffic. Checks
        every critical downstream dependency (postgres, redis, nats,
        object storage). Returns 503 with reasons when not ready.
      responses:
        "200":
          description: Process is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Process is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Phase 0 stub: the bearer token is `dev-stub-token`. Phase 20
        will replace this with full SSO + SCIM + signed capability
        tokens.
    cookieAuth:
      type: apiKey
      in: cookie
      name: domio_session
      description: HttpOnly session cookie set by the auth endpoint.
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: |
        Client-generated unique key for state-changing requests. The
        same key with the same body returns the cached response within
        24 hours. Different bodies with the same key return 409
        Conflict.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+$"
      example: 9b3f0c4d-7e2a-4f9a-b8d1-1c8f3a0e7d5b
    PageToken:
      in: query
      name: page_token
      description: Cursor for keyset pagination.
      schema:
        type: string
        maxLength: 4096
    PageNumber:
      in: query
      name: page
      description: 1-based page number (default 1).
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1
    PageSize:
      in: query
      name: page_size
      description: Page size (default 50, max 200).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  schemas:
    ErrorCode:
      type: string
      enum:
        - internal
        - unavailable
        - timeout
        - cancelled
        - deprecated
        - unauthenticated
        - forbidden
        - permission_denied
        - tenant_isolation
        - brand_lock_violation
        - invalid_argument
        - out_of_range
        - required
        - already_exists
        - not_found
        - conflict
        - precondition_failed
        - idempotency_key_reused
        - idempotency_key_conflict
        - rate_limited
        - quota_exceeded
        - upstream_failure
        - vendor_rejected
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          maxLength: 1024
        details:
          type: object
          additionalProperties:
            type: string
        trace_id:
          type: string
          maxLength: 128
        retryable:
          type: boolean
        retry_after_seconds:
          type: integer
          minimum: 0
    HealthStatus:
      type: string
      enum: [healthy, degraded, unhealthy]
    ComponentHealth:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        status:
          $ref: "#/components/schemas/HealthStatus"
        message:
          type: string
          maxLength: 1024
        latency_ms:
          type: integer
          format: int64
          minimum: 0
        details:
          type: object
          additionalProperties:
            type: string
    HealthzResponse:
      type: object
      required: [status, timestamp, service, version]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        timestamp:
          type: string
          format: date-time
        service:
          type: string
        version:
          type: string
        uptime_seconds:
          type: integer
          format: int64
          minimum: 0
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentHealth"
    ReadinessResponse:
      type: object
      required: [status, ready, timestamp, service, version]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        ready:
          type: boolean
        timestamp:
          type: string
          format: date-time
        service:
          type: string
        version:
          type: string
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentHealth"
        not_ready_reasons:
          type: array
          items:
            type: string
            maxLength: 256
          maxItems: 32
    PageInfo:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total_items:
          type: integer
          format: int64
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
        has_next:
          type: boolean
        has_prev:
          type: boolean
        next_page_token:
          type: string
        prev_page_token:
          type: string
    Money:
      type: object
      required: [currency, amount_micros]
      properties:
        currency:
          type: string
          enum: [USD, EUR, GBP, BDT, INR, JPY, CNY, AUD, CAD]
        amount_micros:
          type: integer
          format: int64
          minimum: 0
    ResourceId:
      type: object
      required: [kind, org_id, tenant_id, id]
      properties:
        kind:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z][a-z0-9_]*$"
        org_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-zA-Z0-9_-]+$"
        tenant_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-zA-Z0-9_-]+$"
        id:
          type: string
          minLength: 1
          maxLength: 128