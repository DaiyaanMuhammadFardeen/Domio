openapi: 3.1.0
info:
  title: Domio Video Assets API
  version: 1.0.0
  description: |
    Video asset CRUD for Phase 11 (#75–#77). Manages video metadata including
    HLS/DASH URLs, transcode state, captions, thumbnails, and waveforms.
    Videos are uploaded and then transcode jobs produce streaming-ready renditions.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: video-assets
    description: Video asset management.
security:
  - bearerAuth: []
paths:
  /v1/video_assets:
    get:
      tags: [video-assets]
      operationId: listVideoAssets
      summary: List video assets
      parameters:
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
        - in: query
          name: transcode_state
          schema:
            type: string
            enum: [pending, processing, ready, failed]
      responses:
        '200':
          description: List of video assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoAssetList'
        '401':
          description: Unauthenticated.
    post:
      tags: [video-assets]
      operationId: uploadVideoAsset
      summary: Upload a video asset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, workspaceId]
              properties:
                file:
                  type: string
                  format: binary
                workspaceId:
                  type: string
                  format: uuid
                name:
                  type: string
                licenseId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Video asset created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoAsset'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated.
  /v1/video_assets/{id}:
    get:
      tags: [video-assets]
      operationId: getVideoAsset
      summary: Get a video asset by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Video asset details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoAsset'
        '401':
          description: Unauthenticated.
        '404':
          description: Video asset not found.
    patch:
      tags: [video-assets]
      operationId: patchVideoAsset
      summary: Update a video asset
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchVideoAssetRequest'
      responses:
        '200':
          description: Video asset updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoAsset'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated.
        '404':
          description: Video asset not found.
    delete:
      tags: [video-assets]
      operationId: deleteVideoAsset
      summary: Delete a video asset
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Video asset deleted.
        '401':
          description: Unauthenticated.
        '404':
          description: Video asset not found.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    VideoAsset:
      type: object
      required:
        [
          id,
          workspaceId,
          uploaderId,
          name,
          sourceUrl,
          durationMs,
          width,
          height,
          hasAudio,
          transcodeState,
        ]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        uploaderId:
          type: string
          format: uuid
        name:
          type: string
        sourceUrl:
          type: string
          format: uri
        hlsUrl:
          type: string
          format: uri
          description: HLS streaming URL (set after transcode)
        dashUrl:
          type: string
          format: uri
          description: DASH streaming URL (set after transcode)
        durationMs:
          type: integer
        width:
          type: integer
        height:
          type: integer
        hasAudio:
          type: boolean
        captionsUrl:
          type: string
          format: uri
          description: WebVTT captions URL
        thumbnailUrl:
          type: string
          format: uri
        waveformUrl:
          type: string
          format: uri
        licenseId:
          type: string
          format: uuid
        transcodeState:
          type: string
          enum: [pending, processing, ready, failed]
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    VideoAssetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VideoAsset'
    PatchVideoAssetRequest:
      type: object
      properties:
        name:
          type: string
        licenseId:
          type: string
          format: uuid
        metadata:
          type: object
          additionalProperties: true
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
