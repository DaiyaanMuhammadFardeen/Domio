openapi: 3.1.0
info:
  title: Domio Video Jobs API
  version: 1.0.0
  description: |
    Video transcode job API for Phase 11 (#75–#77). Accepts a video asset ID,
    target renditions, and extraction flags; dispatches an ffmpeg worker job.
    Supports HLS/DASH output, caption extraction, waveform extraction, and
    priority queuing.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: video-jobs
    description: Video transcode job management.
security:
  - bearerAuth: []
paths:
  /v1/video_jobs:
    post:
      tags: [video-jobs]
      operationId: createVideoJob
      summary: Create a video transcode job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoJobRequest"
      responses:
        "202":
          description: Job accepted; processing asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoJob"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated.
    get:
      tags: [video-jobs]
      operationId: listVideoJobs
      summary: List video jobs for a workspace
      parameters:
        - in: query
          name: workspace_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of video jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoJobList"
        "401":
          description: Unauthenticated.
  /v1/video_jobs/{id}:
    get:
      tags: [video-jobs]
      operationId: getVideoJob
      summary: Get a video job by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoJob"
        "401":
          description: Unauthenticated.
        "404":
          description: Job not found.
    delete:
      tags: [video-jobs]
      operationId: cancelVideoJob
      summary: Cancel a video job
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Job cancelled.
        "401":
          description: Unauthenticated.
        "404":
          description: Job not found.
        "409":
          description: Cannot cancel job in current status.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    VideoJob:
      type: object
      required: [id, videoAssetId, status]
      properties:
        id:
          type: string
          format: uuid
        videoAssetId:
          type: string
          format: uuid
        renditions:
          type: array
          items:
            type: string
          description: "Target renditions, e.g. ['240p','480p','720p','1080p']"
        extractCaptions:
          type: boolean
        extractWaveform:
          type: boolean
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
        status:
          type: string
          enum: [queued, processing, ready, failed]
        statusUrl:
          type: string
          description: Poll this URL for status updates
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
    VideoJobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VideoJob"
    CreateVideoJobRequest:
      type: object
      required: [videoAssetId, renditions]
      properties:
        videoAssetId:
          type: string
          format: uuid
        renditions:
          type: array
          items:
            type: string
            enum: [240p, 480p, 720p, 1080p]
          minItems: 1
        extractCaptions:
          type: boolean
          default: false
        extractWaveform:
          type: boolean
          default: false
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
