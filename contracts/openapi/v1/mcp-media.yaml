  /tools/upload_audio_track:
    post:
      operationId: mcp_upload_audio_track
      tags: [audio]
      summary: upload_audio_track
      description: Upload an audio track.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deckId, slideId, file, kind]
              properties:
                deckId: { type: string }
                slideId: { type: string }
                file: { type: string, description: "Base64-encoded file data" }
                kind: { type: string, enum: [voiceover, music, ambient, sfx] }
                volume: { type: number }
                fadeInMs: { type: integer }
                fadeOutMs: { type: integer }
                licenseId: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "400":
          description: invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpError" }
  /tools/update_audio_track:
    post:
      operationId: mcp_update_audio_track
      tags: [audio]
      summary: update_audio_track
      description: Update an audio track.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deckId, trackId]
              properties:
                deckId: { type: string }
                trackId: { type: string }
                volume: { type: number }
                fadeInMs: { type: integer }
                fadeOutMs: { type: integer }
      responses:
        "200":
          description: OK
