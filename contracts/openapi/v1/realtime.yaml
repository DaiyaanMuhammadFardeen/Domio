openapi: 3.1.0
info:
  title: Domio Realtime API (Phase 04)
  version: 1.0.0
  description: |
    Real-time collaboration endpoints for deck sync and presence.

    REST endpoints expose aggregate status (connection count, active
    sessions, head HLC). The actual CRDT sync and presence channels
    use WebSocket connections documented below as informational
    (non-REST) operations.

    All endpoints require authentication via the bearer token or the
    session cookie. Real auth + tenant isolation land in Phase 20.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.domio.example
    description: Production (placeholder)
tags:
  - name: realtime
    description: Real-time sync and presence status.
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /v1/realtime/decks/{deckId}/sync/status:
    get:
      tags: [realtime]
      operationId: getSyncStatus
      summary: Get sync status for a deck
      description: |
        Returns the current sync status for a deck: the number of
        active WebSocket connections, the head HLC across all branches,
        and the active branch list. Useful for UI indicators and
        monitoring.
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - in: path
          name: deckId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
          description: Deck identifier (ULID).
        - in: query
          name: branchId
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            default: main
          description: Filter status to a specific branch.
      responses:
        '200':
          description: Sync status returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusResponse'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/Error'
        '404':
          description: Deck not found.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/Error'
  /v1/realtime/decks/{deckId}/presence/status:
    get:
      tags: [realtime]
      operationId: getPresenceStatus
      summary: Get presence status for a deck
      description: |
        Returns the current presence status for a deck: the number of
        active sessions, the list of connected avatars (actor ID,
        display name, cursor color, branch), and the session detail
        for each connected peer.
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - in: path
          name: deckId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
          description: Deck identifier (ULID).
        - in: query
          name: branchId
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            default: main
          description: Filter presence to a specific branch.
      responses:
        '200':
          description: Presence status returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresenceStatusResponse'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/Error'
        '404':
          description: Deck not found.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/Error'

# ---------------------------------------------------------------------------
# WebSocket operations (informational — not served by the REST gateway)
# ---------------------------------------------------------------------------

# These describe the two WebSocket endpoints that the realtime gateway
# (services/realtime-gateway) serves directly. They are included here
# for SDK generation and documentation purposes; clients connect to the
# gateway URL, not the REST API gateway.
#
# wss://rtgw.domio/v1/sync/{deckId}
#   Frame flow:
#     Client → Server: Hello  (first frame)
#     Server → Client: Welcome (after handshake + JWT verification)
#     Client → Server: Op     (CRDT update)
#     Server → Client: OpAck  (acknowledgement)
#     Server → Client: Op     (fan-out to other clients)
#     Server → Client: BranchSwitch | BranchHead | Error
#
# wss://rtgw.domio/v1/presence/{deckId}
#   Frame flow:
#     Client → Server: Hello  (first frame)
#     Server → Client: Welcome
#     Client → Server: Presence (cursor, selection, viewport)
#     Server → Client: PeerJoined | PeerLeft | Presence (fan-out)
#     Server → Client: Error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Phase 0 stub: the bearer token is `dev-stub-token`. Phase 20
        will replace this with full SSO + SCIM + signed capability
        tokens.
    cookieAuth:
      type: apiKey
      in: cookie
      name: domio_session
      description: HttpOnly session cookie set by the auth endpoint.
  schemas:
    HLC:
      type: object
      required: [physical, logical]
      additionalProperties: false
      description: Hybrid Logical Clock timestamp.
      properties:
        physical:
          type: integer
          minimum: 0
          description: 'Physical component: unix nanoseconds.'
        logical:
          type: integer
          minimum: 0
          description: 'Logical counter: monotonic tie-breaker.'
    SyncStatusResponse:
      type: object
      required: [deckId, connectionCount, headHlc, branches]
      properties:
        deckId:
          type: string
          minLength: 1
          maxLength: 128
        connectionCount:
          type: integer
          minimum: 0
          description: Number of active WebSocket connections for this deck.
        headHlc:
          description: Current head HLC across all branches.
          allOf:
            - $ref: '#/components/schemas/HLC'
        branches:
          type: array
          items:
            $ref: '#/components/schemas/BranchInfo'
          description: List of active branches with their head HLC.
        traceId:
          type: string
    BranchInfo:
      type: object
      required: [branchId, headHlc, activeSessions]
      properties:
        branchId:
          type: string
          minLength: 1
          maxLength: 128
        headHlc:
          $ref: '#/components/schemas/HLC'
        activeSessions:
          type: integer
          minimum: 0
    PresenceStatusResponse:
      type: object
      required: [deckId, activeSessions, avatars]
      properties:
        deckId:
          type: string
          minLength: 1
          maxLength: 128
        activeSessions:
          type: integer
          minimum: 0
          description: Total number of active presence sessions.
        avatars:
          type: array
          items:
            $ref: '#/components/schemas/AvatarInfo'
          description: List of connected peer avatars.
        traceId:
          type: string
    AvatarInfo:
      type: object
      required: [actorId, sessionId, color, branchId]
      properties:
        actorId:
          type: string
          minLength: 1
          maxLength: 128
          description: Actor (user) identifier — ULID.
        sessionId:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
          maxLength: 256
        color:
          type: string
          description: Deterministic cursor color derived from actor_id hash.
          pattern: '^#[0-9a-fA-F]{6}$'
        branchId:
          type: string
          minLength: 1
          maxLength: 128
          default: main
        lastSeenAt:
          type: string
          format: date-time
