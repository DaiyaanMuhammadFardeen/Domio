apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "domio.fullname" . }}-config
  labels:
    {{- include "domio.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.configMap.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otlpEndpoint | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}