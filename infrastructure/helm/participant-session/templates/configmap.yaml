apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "participant-session.fullname" . }}-config
  labels:
    {{- include "participant-session.labels" . | nindent 4 }}
data:
  PARTICIPANT_PORT: {{ .Values.service.port | quote }}
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  FEATURE_AUDIENCE_JOIN: {{ .Values.featureFlags.audienceJoin | quote }}
  FEATURE_AUDIENCE_FANOUT: {{ .Values.featureFlags.audienceFanout | quote }}
  FEATURE_AUDIENCE_HEARTBEAT: {{ .Values.featureFlags.audienceHeartbeat | quote }}
  IDEMPOTENCY_TTL_MS: {{ .Values.idempotency.ttlMs | quote }}