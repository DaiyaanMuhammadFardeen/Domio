{{- range $s := .Values.secrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $s.name }}
  namespace: {{ $s.namespace }}
  labels:
    {{- include "secrets.labels" $ | nindent 4 }}
    {{- with $s.template.metadata.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  secretStoreRef:
    name: {{ include "secrets.fullname" $ }}
    kind: SecretStore
  refreshInterval: {{ $.Values.refreshInterval }}
  data:
    {{- range $k := $s.keys }}
    - secretKey: {{ $k }}
      remoteRef:
        key: {{ $s.path }}
        property: {{ $k }}
    {{- end }}
  target:
    name: {{ $s.name }}
    {{- with $s.template }}
    template:
      type: {{ .type }}
      {{- with .metadata }}
      metadata:
        {{- with .labels }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
