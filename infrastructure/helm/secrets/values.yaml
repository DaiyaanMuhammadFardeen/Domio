# Default values for the secrets chart.
# Wires the External Secrets Operator to the Vault cluster.

vault:
  # The Vault server address. In-cluster dev uses the sidecar; production
  # points at the managed Vault endpoint.
  address: http://vault.vault.svc.cluster.local:8200
  authMethod: kubernetes
  authPath: auth/kubernetes
  mountPath: kubernetes
  role: domio-secrets
  # Renovation period for SecretStore resource discovery.
  refreshInterval: 60s

# How often ESO polls Vault for refreshed credentials.
refreshInterval: 5m

# Per-namespace ExternalSecret manifests emitted into the cluster.
secrets:
  - name: api-gateway-db
    namespace: domio
    backend: vault
    path: domio/api-gateway/database
    keys:
      - username
      - password
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/component: api-gateway
          domio.example.com/managed-by: external-secrets
  - name: realtime-gateway-jwt
    namespace: domio
    backend: vault
    path: domio/realtime-gateway/jwt
    keys:
      - signing-key
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/component: realtime-gateway
          domio.example.com/managed-by: external-secrets
  - name: editor-otel
    namespace: domio
    backend: vault
    path: domio/editor/otel
    keys:
      - exporter-token
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/component: editor
          domio.example.com/managed-by: external-secrets
  - name: postgres-backup-kms
    namespace: domio
    backend: vault
    path: domio/postgres/backup
    keys:
      - kms-key-id
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/component: postgres
          domio.example.com/managed-by: external-secrets

# Optional on-call routing ConfigMap (alertmanager side). The actual
# PagerDuty keys are themselves ESO-managed, but the routing rules are
# static so we ship them as a ConfigMap.
oncall:
  enabled: true
  namespace: observability
  configMapName: domio-oncall
