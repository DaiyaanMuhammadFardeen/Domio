apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ .Values.ingressClass.name }}
  labels:
    {{- include "ingress.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingressClass.isDefault }}
  controller: k8s.io/{{ .Values.controller.type }}
  parameters:
    apiGroup: k8s.io
    kind: DefaultIngressClassParameter
  {{- else }}
  controller: k8s.io/{{ .Values.controller.type }}
  {{- end }}