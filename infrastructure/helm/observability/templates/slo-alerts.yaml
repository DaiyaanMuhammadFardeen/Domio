{{- if .Values.sloAlerts.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: slo-alerts
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: slo-alerts
data:
  slos.yml: |
    groups:
      - name: domio-slos
        interval: 30s
        rules:
          - alert: SLORequestAvailabilityBreached
            expr: |
              sum(rate(http_requests_total{code=~"5.."}[5m]))
                /
              sum(rate(http_requests_total[5m])) > 0.01
            for: 5m
            labels:
              severity: page
              slo: request-availability
          - alert: SLOP95LatencyBreached
            expr: |
              histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
            for: 5m
            labels:
              severity: page
              slo: p95-latency
          - alert: SLOErrorRateBreached
            expr: |
              sum(rate(http_requests_total{code=~"5.."}[5m]))
                /
              sum(rate(http_requests_total[5m])) > 0.05
            for: 5m
            labels:
              severity: page
              slo: error-rate
          - alert: SLOIngestionFreshnessBreached
            expr: time() - max(ingest_last_event_timestamp_seconds) > 60
            for: 5m
            labels:
              severity: page
              slo: ingestion-freshness
          - alert: RealtimeGatewayOpRoundTripP95Breached
            expr: |
              histogram_quantile(0.95, sum(rate(rtgw_sync_op_round_trip_ms_bucket[5m])) by (le)) > 250
            for: 5m
            labels:
              severity: page
              slo: realtime-op-round-trip-p95
              phase: "04"
            annotations:
              summary: "Realtime gateway op round-trip p95 > 250 ms"
              description: |
                CRDT op round-trip latency is degraded. Investigate NATS, Redis, or
                control-plane gRPC latency. See docs/development_phases/phase-04
                §5-C.3 (sync_op_round_trip_ms).
          - alert: RealtimeGatewayCrdtConvergenceP95Breached
            expr: |
              histogram_quantile(0.95, sum(rate(rtgw_sync_crdt_convergence_ms_bucket[5m])) by (le)) > 2000
            for: 5m
            labels:
              severity: page
              slo: realtime-crdt-convergence-p95
              phase: "04"
            annotations:
              summary: "CRDT convergence p95 > 2 s"
              description: |
                Two replicas are taking > 2 s to converge. Likely root causes:
                JetStream backlog, replay pressure, or a hot sub-doc with many
                pending updates. See docs/development_phases/phase-04 §5-C.3
                (sync_crdt_convergence_ms).
{{- end }}