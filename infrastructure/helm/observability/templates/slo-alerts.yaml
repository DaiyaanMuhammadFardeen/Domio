{{- if .Values.sloAlerts.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: slo-alerts
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: slo-alerts
data:
  slos.yml: |
    groups:
      - name: domio-slos
        interval: 30s
        rules:
          - alert: SLORequestAvailabilityBreached
            expr: sum(rate(http_requests_total{code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.01
            for: 5m
            labels:
              severity: page
              slo: request-availability
          - alert: SLOP95LatencyBreached
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
            for: 5m
            labels:
              severity: page
              slo: p95-latency
          - alert: SLOErrorRateBreached
            expr: sum(rate(http_requests_total{code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.05
            for: 5m
            labels:
              severity: page
              slo: error-rate
          - alert: SLOIngestionFreshnessBreached
            expr: time() - max(ingest_last_event_timestamp_seconds) > 60
            for: 5m
            labels:
              severity: page
              slo: ingestion-freshness
          - alert: RealtimeGatewayOpRoundTripP95Breached
            expr: histogram_quantile(0.95, sum(rate(rtgw_sync_op_round_trip_ms_bucket[5m])) by (le)) > 250
            for: 5m
            labels:
              severity: page
              slo: realtime-op-round-trip-p95
              phase: "04"
          - alert: RealtimeGatewayCrdtConvergenceP95Breached
            expr: histogram_quantile(0.95, sum(rate(rtgw_sync_crdt_convergence_ms_bucket[5m])) by (le)) > 2000
            for: 5m
            labels:
              severity: page
              slo: realtime-crdt-convergence-p95
              phase: "04"
          - alert: BranchDiffDurationP95Breached
            expr: histogram_quantile(0.95, sum(rate(branch_diff_duration_ms_bucket[5m])) by (le)) > 2000
            for: 5m
            labels:
              severity: page
              slo: branch-diff-duration-p95
              phase: "05"
            annotations:
              summary: "Branch diff duration p95 > 2 s"
              description: "3-way branch diff computation exceeds the Phase 05 latency budget."
          - alert: SnapshotDurationMsBreached
            expr: histogram_quantile(0.95, sum(rate(snapshot_duration_ms_bucket[5m])) by (le)) > 5000
            for: 5m
            labels:
              severity: page
              slo: snapshot-duration-p95
              phase: "05"
            annotations:
              summary: "Snapshot materialization duration p95 > 5 s"
              description: "Snapshot materialization exceeds the Phase 05 latency budget."
{{- end }}