name: CI

# Domio — master CI/CD orchestrator (production gate).
#
# All required checks must pass for this workflow to succeed. The
# individual checks live in their own reusable workflows (see
# .github/workflows/*.yml) and run in parallel.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    uses: ./.github/workflows/contract.yml
  typecheck:
    uses: ./.github/workflows/type.yml
  lint:
    uses: ./.github/workflows/lint.yml
  schema-validate:
    uses: ./.github/workflows/schema-validate.yml
  schema-migration-lint:
    uses: ./.github/workflows/schema-migration-lint.yml
  unit:
    uses: ./.github/workflows/unit.yml
  integration:
    uses: ./.github/workflows/integration.yml
  smoke:
    uses: ./.github/workflows/smoke.yml
  external-e2e:
    uses: ./.github/workflows/external-e2e.yml
  editor-e2e:
    uses: ./.github/workflows/editor-e2e.yml
  a11y-i18n:
    uses: ./.github/workflows/a11y-i18n.yml
  axe:
    uses: ./.github/workflows/axe.yml
  chaos:
    uses: ./.github/workflows/chaos.yml
  security:
    uses: ./.github/workflows/security.yml
  leak-scan:
    uses: ./.github/workflows/leak-scan.yml
  public-beta-gate:
    uses: ./.github/workflows/public-beta-gate.yml

  load:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/load.yml

  build-provenance:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-provenance.yml

  gate:
    needs:
      - contracts
      - typecheck
      - lint
      - schema-validate
      - schema-migration-lint
      - unit
      - integration
      - smoke
      - external-e2e
      - editor-e2e
      - a11y-i18n
      - axe
      - chaos
      - security
      - leak-scan
      - public-beta-gate
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all required jobs passed
        run: |
          set +e
          failed=()
          for j in contracts typecheck lint schema-validate schema-migration-lint unit integration smoke external-e2e editor-e2e a11y-i18n axe chaos security leak-scan public-beta-gate; do
            case "$j" in
              contracts) s="${{ needs.contracts.result }}" ;;
              typecheck) s="${{ needs.typecheck.result }}" ;;
              lint) s="${{ needs.lint.result }}" ;;
              schema-validate) s="${{ needs.schema-validate.result }}" ;;
              schema-migration-lint) s="${{ needs.schema-migration-lint.result }}" ;;
              unit) s="${{ needs.unit.result }}" ;;
              integration) s="${{ needs.integration.result }}" ;;
              smoke) s="${{ needs.smoke.result }}" ;;
              external-e2e) s="${{ needs.external-e2e.result }}" ;;
              editor-e2e) s="${{ needs.editor-e2e.result }}" ;;
              a11y-i18n) s="${{ needs.a11y-i18n.result }}" ;;
              axe) s="${{ needs.axe.result }}" ;;
              chaos) s="${{ needs.chaos.result }}" ;;
              security) s="${{ needs.security.result }}" ;;
              leak-scan) s="${{ needs.leak-scan.result }}" ;;
              public-beta-gate) s="${{ needs.public-beta-gate.result }}" ;;
            esac
            echo "  ${j}: ${s}"
            if [[ "$s" != "success" && "$s" != "skipped" ]]; then
              failed+=("${j}")
            fi
          done
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "❌ FAILED required checks: ${failed[@]}"
            exit 1
          fi
          echo "✅ All required checks passed."
