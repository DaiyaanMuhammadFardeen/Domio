name: leak-scan

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: leak-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2.3.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks/gitleaks.toml
        with:
          config-path: .gitleaks/gitleaks.toml
          fail-on-detection: true