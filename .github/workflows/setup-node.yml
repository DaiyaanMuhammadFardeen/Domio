name: setup-node

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version (must match .tool-versions).
        type: string
        default: '22.11.0'
      install:
        description: Run `pnpm install` with the workspace cache.
        type: boolean
        default: true
      cache:
        description: Enable pnpm store caching.
        type: boolean
        default: true
      os:
        description: Runner OS slug.
        type: string
        default: ubuntu-latest

jobs:
  main:
    name: setup-node
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 9.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Cache pnpm store
        if: ${{ inputs.cache }}
        uses: actions/cache@v4.2.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ inputs.node-version }}-

      - name: Install dependencies
        if: ${{ inputs.install }}
        run: pnpm install --frozen-lockfile
        shell: bash
