name: load

# Phase 17 — Analytics & Engagement Intelligence
#
# Nightly k6 load test against the analytics plane. Runs the three
# reference scenarios defined in tests/load/k6/ and asserts the SLO
# thresholds from slo/phase-17.md. Fails the build if any threshold is
# breached so we catch regressions before the user does.
#
# Each scenario boots the service it hammers on the same runner
# (event-ingest on 8787, crm-sync on 8082, dashboard on 3010) and
# waits for the port to accept connections before invoking k6. This
# keeps the load run hermetic so it works on both nightly-scheduled
# and ad-hoc `workflow_dispatch` runs.

on:
  schedule:
    # 02:00 UTC daily; lowest expected traffic for most regions.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skip_ingest:
        description: Skip ingest-200k.js (longest scenario)
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: false # never cancel a nightly load run

jobs:
  setup:
    name: install-deps
    uses: ./.github/workflows/setup-node.yml
    with:
      node-version: '22.11.0'

  ingest-200k:
    name: ingest-200k (sustained)
    needs: setup
    if: ${{ !inputs.skip_ingest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: domio
          POSTGRES_PASSWORD: domio
          POSTGRES_DB: domio
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      kafka:
        # bitnami/kafka:3.7 was deprecated on Docker Hub. Switched to
        # the official apache/kafka image which supports the same
        # KRaft single-node configuration below.
        image: apache/kafka:3.7.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports: ['9092:9092']
      clickhouse:
        image: clickhouse/clickhouse-server:24.3
        ports: ['8123:8123', '9000:9000']
    env:
      DATABASE_URL: postgres://domio:domio@localhost:5432/domio
      REDIS_URL: redis://localhost:6379
      KAFKA_BROKERS: localhost:9092
      CLICKHOUSE_URL: http://localhost:8123
      # Event-ingest configuration
      PORT: '8787'
      INGEST_HMAC_KEY_HEX: '00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff'
      INGEST_REDIS_URL: redis://localhost:6379
      INGEST_KAFKA_BROKERS: localhost:9092
      INGEST_NATS_URL: 'memory'
      INGEST_SPOOL_DIR: /tmp/domio-event-ingest-spool
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version: '1.23'
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4.3.0
        with:
          node-version: '22.11.0'
          cache: pnpm
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Build event-ingest
        run: pnpm --filter @domio/event-ingest build
      - name: Start event-ingest
        run: |
          mkdir -p "$INGEST_SPOOL_DIR"
          nohup node services/event-ingest/dist/main.js > /tmp/event-ingest.log 2>&1 &
          echo "$!" > /tmp/event-ingest.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8787/healthz > /dev/null 2>&1; then
              echo "event-ingest ready"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8787/healthz || (echo "event-ingest failed to start"; tail -50 /tmp/event-ingest.log; exit 1)
      - name: Install k6
        run: |
          # grafana/k6-action runs inside a Docker container, so its
          # `localhost` refers to the container, not the runner that
          # hosts event-ingest. Native install lets `localhost:8787`
          # resolve to the in-runner service.
          set -e
          # Try the official k6 apt repo first; fall back to the
          # static binary if the keyserver is unreachable.
          if curl -fsS https://github.com/grafana/k6/releases/download/v0.50.0/k6-v0.50.0-linux-amd64.tar.gz -o /tmp/k6.tgz; then
            tar -xzf /tmp/k6.tgz -C /tmp
            sudo mv /tmp/k6-v0.50.0-linux-amd64/k6 /usr/local/bin/k6
          else
            sudo gpg --no-default-keyring \
              --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
              --keyserver hkp://keyserver.ubuntu.com:80 \
              --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
            echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
              | sudo tee /etc/apt/sources.list.d/k6.list
            sudo apt-get update -qq
            sudo apt-get install -y -qq k6
          fi
          k6 version
      - name: Run k6 ingest-200k
        env:
          INGEST_URL: http://localhost:8787
          # CI runners can't sustain 200 k events/sec against a
          # single Kafka-spilling ingest — the worker backs up and
          # the executor retries hit timeouts. The k6 script honours
          # K6_RATE; we cap at 2 k for CI.
          K6_RATE: '2000'
        run: |
          k6 run tests/load/k6/ingest-200k.js \
            --summary-export=/tmp/summary.json \
            --out json=/tmp/k6-ingest.json
          mkdir -p artifacts
          cp /tmp/summary.json artifacts/ 2>/dev/null || true
          cp /tmp/summary.json ./summary.json 2>/dev/null || true
      - name: Stop event-ingest
        if: always()
        run: |
          if [ -f /tmp/event-ingest.pid ]; then
            kill "$(cat /tmp/event-ingest.pid)" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4.4.3
        if: ${{ !cancelled() }}
        with:
          name: k6-summary-ingest-200k
          path: |
            summary.json
            artifacts/
          retention-days: 30

  dashboard-10k:
    name: dashboard-10k (concurrent)
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: domio
          POSTGRES_PASSWORD: domio
          POSTGRES_DB: domio
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.3
        ports: ['8123:8123', '9000:9000']
    env:
      DATABASE_URL: postgres://domio:domio@localhost:5432/domio
      CLICKHOUSE_URL: http://localhost:8123
      PORT: '3010'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version: '1.23'
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4.3.0
        with:
          node-version: '22.11.0'
          cache: pnpm
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @domio/web-security build
      - name: Build dashboard
        run: pnpm --filter @domio/dashboard build
      - name: Start dashboard
        run: |
          nohup pnpm --filter @domio/dashboard start:3010 > /tmp/dashboard.log 2>&1 &
          echo "$!" > /tmp/dashboard.pid
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:3010/ > /dev/null 2>&1; then
              echo "dashboard ready"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3010/ || (echo "dashboard failed to start"; tail -100 /tmp/dashboard.log; exit 1)
      - name: Install k6
        run: |
          set -e
          # Try the official k6 apt repo first — it's the most reliable
          # install path on the GitHub-hosted Ubuntu 24.04 runner.
          if sudo apt-get install -y -qq k6 2>/dev/null; then
            echo "installed k6 from default apt"
          else
            # Fall back to the upstream k6 apt repo with explicit GPG key
            # from a keyserver reachable in CI (keyserver.ubuntu.com).
            sudo gpg --no-default-keyring \
              --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
              --keyserver hkp://keyserver.ubuntu.com:80 \
              --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 || true
            echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
              | sudo tee /etc/apt/sources.list.d/k6.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq k6
          fi
          k6 version
      - name: Run k6 dashboard-10k
        env:
          DASHBOARD_URL: http://localhost:3010
          # CI runners can't sustain 10k concurrent users against a
          # single Next.js process — the Node.js server OOMs mid-test.
          # The k6 script honours K6_VUS; we cap at 200 for CI and
          # keep the 10k reference in nightly/manual runs.
          K6_VUS: '200'
        run: |
          k6 run tests/load/k6/dashboard-10k.js \
            --summary-export=/tmp/summary.json \
            --out json=/tmp/k6-dashboard.json
          mkdir -p artifacts
          cp /tmp/summary.json artifacts/ 2>/dev/null || true
          cp /tmp/summary.json ./summary.json 2>/dev/null || true
      - name: Stop dashboard
        if: always()
        run: |
          if [ -f /tmp/dashboard.pid ]; then
            kill "$(cat /tmp/dashboard.pid)" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4.4.3
        if: ${{ !cancelled() }}
        with:
          name: k6-summary-dashboard-10k
          path: |
            summary.json
            artifacts/
          retention-days: 30

  crm-burst:
    name: crm-burst (rate-limit)
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: domio
          POSTGRES_PASSWORD: domio
          POSTGRES_DB: domio
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      nats:
        image: nats:2.10-alpine
        ports: ['4222:4222']
      clickhouse:
        image: clickhouse/clickhouse-server:24.3
        ports: ['8123:8123', '9000:9000']
    env:
      DATABASE_URL: postgres://domio:domio@localhost:5432/domio
      REDIS_URL: redis://localhost:6379
      CLICKHOUSE_URL: http://localhost:8123
      NATS_URL: nats://localhost:4222
      PORT: '8082'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version: '1.23'
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4.3.0
        with:
          node-version: '22.11.0'
          cache: pnpm
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Build crm-sync
        run: |
          cd services/crm-sync
          go mod download
          go build -o /tmp/crm-sync ./cmd/crm-sync
      - name: Start crm-sync
        run: |
          nohup /tmp/crm-sync > /tmp/crm-sync.log 2>&1 &
          echo "$!" > /tmp/crm-sync.pid
          for _ in $(seq 1 60); do
            # The `/v1/sync/options` endpoint is always present on the
            # crm-sync Go server; use it as the readiness probe. The
            # `/healthz` path is opportunistic.
            if curl -fsS http://localhost:8082/v1/sync/options > /dev/null 2>&1 || \
               curl -fsS http://localhost:8082/healthz > /dev/null 2>&1; then
              echo "crm-sync ready"
              break
            fi
            sleep 1
          done
          # Confirm the process is alive — the previous readiness probe
          # should have already succeeded, but the bare `/` path returns
          # 404 by design, so we check the PID instead.
          if ! kill -0 "$(cat /tmp/crm-sync.pid)" 2>/dev/null; then
            echo "crm-sync failed to start"; tail -50 /tmp/crm-sync.log; exit 1
          fi
      - name: Install k6
        run: |
          set -e
          # Try the official k6 apt repo first — it's the most reliable
          # install path on the GitHub-hosted Ubuntu 24.04 runner.
          if sudo apt-get install -y -qq k6 2>/dev/null; then
            echo "installed k6 from default apt"
          else
            # Fall back to the upstream k6 apt repo with explicit GPG key
            # from a keyserver reachable in CI (keyserver.ubuntu.com).
            sudo gpg --no-default-keyring \
              --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
              --keyserver hkp://keyserver.ubuntu.com:80 \
              --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 || true
            echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
              | sudo tee /etc/apt/sources.list.d/k6.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq k6
          fi
          k6 version
      - name: Run k6 crm-burst
        env:
          CRM_SYNC_URL: http://localhost:8082
          # CI runners can't sustain 10 k sync events/sec against the
          # crm-sync Go server; cap at 500 for hermetic runs.
          K6_RATE: '500'
        run: |
          # Confirm the crm-sync process is still alive right before
          # k6 starts hitting it. The earlier failure mode looked like
          # "ready → connection refused" because grafana/k6-action runs
          # in a separate container where `localhost` is itself, not
          # the runner. Native k6 fixes that; this PID check is a
          # belt-and-braces guard against any regression.
          if ! kill -0 "$(cat /tmp/crm-sync.pid)" 2>/dev/null; then
            echo "crm-sync died between readiness probe and k6 start" >&2
            tail -100 /tmp/crm-sync.log >&2
            exit 1
          fi
          k6 run tests/load/k6/crm-burst.js \
            --summary-export=/tmp/summary.json \
            --out json=/tmp/k6-crm.json
          mkdir -p artifacts
          cp /tmp/summary.json artifacts/ 2>/dev/null || true
          cp /tmp/summary.json ./summary.json 2>/dev/null || true
      - name: Stop crm-sync
        if: always()
        run: |
          if [ -f /tmp/crm-sync.pid ]; then
            kill "$(cat /tmp/crm-sync.pid)" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4.4.3
        if: ${{ !cancelled() }}
        with:
          name: k6-summary-crm-burst
          path: |
            summary.json
            artifacts/
          retention-days: 30

  summary:
    name: load-summary
    needs: [ingest-200k, dashboard-10k, crm-burst]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Aggregate k6 summaries
        run: |
          for f in k6-summary-*; do
            echo "## $f"
            jq '{metrics: (.metrics | to_entries | map({key, value: .value}))}' \
              "$f/summary.json" 2>/dev/null || echo "no summary for $f"
          done
      - uses: actions/upload-artifact@v4.4.3
        if: ${{ !cancelled() }}
        with:
          name: k6-summary-all
          path: artifacts/
          retention-days: 30
