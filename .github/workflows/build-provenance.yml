name: build-provenance

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_call:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-api-image:
    name: build-api-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.9.0
      - uses: docker/login-action@v3.3.0
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ghcr.io/domio/api
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
      - name: Build & push
        uses: docker/build-push-action@v6.12.0
        with:
          context: apps/api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Emit SLSA provenance
        run: node tools/provenance/dist/cli.mjs emit --subject "ghcr.io/domio/api@sha-${{ github.sha }}" --builder-id "github.com/domio/actions/api-build" --materials ./apps/api > dist/provenance.intoto.jsonl
      - uses: actions/attest-build-provenance@v2.0.0
        if: ${{ github.event_name != 'pull_request' }}
        with:
          subject-checksums: |
            ghcr.io/domio/api:sha-${{ github.sha }}