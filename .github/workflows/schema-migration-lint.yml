name: schema-migration-lint

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'infrastructure/postgres/migrations/**'
  push:
    branches: [master, main]
    paths:
      - 'infrastructure/postgres/migrations/**'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: migration-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: install-deps
    uses: ./.github/workflows/reusable/setup-node.yml
    with:
      node-version: '22.11.0'

  lint:
    name: migration-lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.3.0
        with:
          node-version: '22.11.0'
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 9.12.3
      - name: Cache pnpm store
        uses: actions/cache@v4.2.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-22.11.0-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Run migration-lint
        run: |
          pnpm --filter @domio/migration-lint run lint \
            --rules-dir tools/migration-lint/rules \
            --migrations infrastructure/postgres/migrations \
            --strict