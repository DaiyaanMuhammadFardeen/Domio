name: editor-e2e

# Phase 22-beta WS-A — Editor Playwright e2e suite.
#
# Runs the 11 Playwright specs in `apps/editor/e2e/` against a freshly
# built editor on port 3100. Triggers on PR/push touching the editor
# or its e2e specs; can also be invoked manually. Fails on the first
# failing spec — these are smoke-level functional checks, not
# regression hunts.

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'apps/editor/**'
      - '.github/workflows/editor-e2e.yml'
      - 'tests/a11y/**'
  push:
    branches: [master, main]
    paths:
      - 'apps/editor/**'
      - '.github/workflows/editor-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: install-deps
    uses: ./.github/workflows/setup-node.yml
    with:
      node-version: '22.11.0'

  build:
    name: build editor
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4.3.0
        with:
          node-version: '22.11.0'
          cache: pnpm
      - name: Cache pnpm store
        uses: actions/cache@v4.2.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-22.11.0-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @domio/web-security build
      - name: Build editor
        run: pnpm --filter @domio/editor build

  e2e:
    name: playwright e2e
    needs: [setup, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://domio:domio@localhost:5432/domio
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: domio
          POSTGRES_PASSWORD: domio
          POSTGRES_DB: domio
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4.3.0
        with:
          node-version: '22.11.0'
          cache: pnpm
      - name: Cache pnpm store
        uses: actions/cache@v4.2.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-22.11.0-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @domio/web-security build
      - name: Build editor
        run: pnpm --filter @domio/editor build
      - name: Start editor (production build)
        run: |
          pnpm --filter @domio/editor start:3100 &
          SERVE_PID=$!
          echo "SERVE_PID=$SERVE_PID" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3100 > /dev/null 2>&1; then break; fi
            sleep 2
          done
      - name: Install Playwright browsers
        run: pnpm --filter @domio/editor exec playwright install --with-deps chromium
      - name: Run e2e specs
        run: pnpm --filter @domio/editor exec playwright test --reporter=github
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.4.3
        with:
          name: editor-e2e-report
          path: apps/editor/playwright-report/
          retention-days: 14
      - name: Upload test-results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.4.3
        with:
          name: editor-e2e-results
          path: apps/editor/test-results/
          retention-days: 14
      - name: Tear down
        if: ${{ always() }}
        run: |
          if [ -n "$SERVE_PID" ]; then kill "$SERVE_PID" || true; fi
          pkill -f "next start" || true
