name: threat-model-diff

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'threat-model/**'
  push:
    branches: [master, main]
    paths:
      - 'threat-model/**'
  workflow_call:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: threat-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.3.0
        with:
          node-version: '22.11.0'
      - run: pnpm install --frozen-lockfile
      - name: Run threat-model validator
        run: pnpm --filter @domio/threat-model-tools run validate

  diff-comment:
    name: diff-comment
    needs: validate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.3.0
        with:
          node-version: '22.11.0'
      - run: pnpm install --frozen-lockfile
      - name: Post STRIDE diff comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: node threat-model/tools/diff-comment.mjs "$PR_NUMBER" threat-model/

  block-new-without-stride:
    name: block-new-without-stride
    needs: validate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.3.0
        with:
          node-version: '22.11.0'
      - run: pnpm install --frozen-lockfile
      - name: Detect new files missing required STRIDE sections
        run: node threat-model/tools/require-stride.mjs threat-model/components/