name: setup-python

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version (must match .tool-versions).
        type: string
        default: '3.12.8'
      cache:
        description: Enable pip cache.
        type: boolean
        default: true

jobs:
  main:
    name: setup-python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ inputs.cache }}

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.5.11
        shell: bash